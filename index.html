/* =========================================================
   WALK ANIMATION
========================================================= */

function animateCharacter(c,moving,time){

    if(!c || !c.parts) return;

    const p = c.parts;

    if(moving){

        const swing = Math.sin(time * 0.015) * 0.35;

        p.leftArm.rotation = swing;
        p.rightArm.rotation = -swing;

        p.leftLeg.rotation = -swing * .75;
        p.rightLeg.rotation = swing * .75;

        p.leftHand.y = 25 + Math.sin(time * .015) * 3;
        p.rightHand.y = 25 - Math.sin(time * .015) * 3;

    }else{

        p.leftArm.rotation = 0;
        p.rightArm.rotation = 0;

        p.leftLeg.rotation = 0;
        p.rightLeg.rotation = 0;
    }
}

}


/* =========================================================
   NPC AI
========================================================= */

function setupNPC(npc){

    npc.targetX =
        100 +
        Math.random() *
        (WORLD_W-200);

    npc.targetY =
        100 +
        Math.random() *
        (WORLD_H-200);

    npc.speed =
        35 +
        Math.random()*30;
}


function updateNPC(npc,delta,time){

    const dx = npc.targetX - npc.x;
    const dy = npc.targetY - npc.y;

    const dist = Math.sqrt(dx*dx+dy*dy);

    if(dist < 20){

        npc.targetX =
            150 +
            Math.random() *
            (WORLD_W-300);

        npc.targetY =
            150 +
            Math.random() *
            (WORLD_H-300);

        return;
    }

    const vx = dx/dist;
    const vy = dy/dist;

    npc.x += vx*npc.speed*delta/1000;
    npc.y += vy*npc.speed*delta/1000;

    npc.rotation =
        Phaser.Math.Clamp(vx*.03,-.04,.04);

    animateCharacter(npc,true,time);
}

        npcPositions.forEach((pos,i)=>{

            const npc = createNPC(
                this,
                pos[0],
                pos[1],
                i
            );

            setupNPC(npc);

            npcs.push(npc);
        });

        /* CAMERA */
        this.cameras.main.startFollow(
            player,
            true,
            .08,
            .08
        );

        this.cameras.main.setBounds(
            0,
            0,
            WORLD_W,
            WORLD_H
        );

        /* KEYBOARD */
        cursors =
            this.input.keyboard.createCursorKeys();

        keys =
            this.input.keyboard.addKeys(
                "W,A,S,D"
            );

        /* OBJECTIVE */
        this.add.circle(
            760,
            250,
            20,
            0x00ffff,
            .8
        )
        .setDepth(5);

        this.add.text(
            760,
            220,
            "OBJECTIVE",
            {
                fontSize:"14px",
                color:"#00ffff",
                fontStyle:"bold"
            }
        )
        .setOrigin(.5);

        /* HUD */
        this.add.rectangle(
            110,
            50,
            210,
            70,
            0x05070b,
            .75
        )
        .setScrollFactor(0)
        .setDepth(100);

        this.add.text(
            30,
            28,
            "PARTY NIGHT",
            {
                fontSize:"23px",
                color:"#00eaff",
                fontStyle:"bold"
            }
        )
        .setScrollFactor(0)
        .setDepth(101);

        this.add.text(
            30,
            58,
            "Find the objective",
            {
                fontSize:"15px",
                color:"#ffffff"
            }
        )
        .setScrollFactor(0)
        .setDepth(101);
    }


    update(time,delta){

        if(!player) return;

        let vx = 0;
        let vy = 0;

        if(
            cursors.left.isDown ||
            keys.A.isDown
        ){
            vx -= 1;
        }

        if(
            cursors.right.isDown ||
            keys.D.isDown
        ){
            vx += 1;
        }

        if(
            cursors.up.isDown ||
            keys.W.isDown
        ){
            vy -= 1;
        }

        if(
            cursors.down.isDown ||
            keys.S.isDown
        ){
            vy += 1;
        }

        if(joystick.active){

            vx += joystick.x;
            vy += joystick.y;
        }

        const moving =
            Math.abs(vx) > .05 ||
            Math.abs(vy) > .05;

        if(moving){

            const len =
                Math.sqrt(vx*vx+vy*vy);

            vx /= len;
            vy /= len;

            const speed = 210;

            player.x += vx*speed*delta/1000;
            player.y += vy*speed*delta/1000;

            player.x =
                Phaser.Math.Clamp(
                    player.x,
                    50,
                    WORLD_W-50
                );

            player.y =
                Phaser.Math.Clamp(
                    player.y,
                    50,
                    WORLD_H-50
                );

            /* Face direction */
            if(vx < -.1){
                player.scaleX = -1;
            }

            if(vx > .1){
                player.scaleX = 1;
            }
        }

        animateCharacter(
            player,
            moving,
            time
        );

        npcs.forEach(npc=>{
            updateNPC(
                npc,
                delta,
                time
            );
        });
    }
}


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joy =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

function joystickMove(e){

    const rect =
        joy.getBoundingClientRect();

    const touch =
        e.touches[0];

    let x =
        touch.clientX -
        (rect.left + rect.width/2);

    let y =
        touch.clientY -
        (rect.top + rect.height/2);

    const max = 42;

    const dist =
        Math.sqrt(x*x+y*y);

    if(dist > max){

        x = x/dist*max;
        y = y/dist*max;
    }

    stick.style.left =
        (31+x)+"px";

    stick.style.top =
        (31+y)+"px";

    joystick.x = x/max;
    joystick.y = y/max;
    joystick.active = true;
}

joy.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        joystickMove(e);
    },
    {passive:false}
);

joy.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();
        joystickMove(e);
    },
    {passive:false}
);

function joystickReset(){

    stick.style.left="31px";
    stick.style.top="31px";

    joystick.x=0;
    joystick.y=0;
    joystick.active=false;
}

joy.addEventListener(
    "touchend",
    joystickReset
);

joy.addEventListener(
    "touchcancel",
    joystickReset
);


/* =========================================================
   ACTION BUTTON
========================================================= */

document
.getElementById("action")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();

        if(player){

            player.setScale(
                player.scaleX*1.08,
                1.08
            );

            setTimeout(()=>{
                if(player){
                    player.scaleX =
                        player.scaleX < 0
                        ? -1
                        : 1;

                    player.scaleY = 1;
                }
            },120);
        }
    },
    {passive:false}
);
