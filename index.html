<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Party Night Chaos</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:white;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#02050a;
}

/* =========================================================
   CANVAS
========================================================= */

#world{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
    position:absolute;
    z-index:20;
    left:0;
    top:0;
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 22px;

    background:
        linear-gradient(
            180deg,
            rgba(1,6,12,.96),
            rgba(1,6,12,.65),
            transparent
        );

    pointer-events:none;
}

.logo{
    font-size:28px;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-1px;
    text-shadow:0 2px 5px #000;
}

.logo span{
    color:#ff0ca8;
    text-shadow:
        0 0 12px rgba(255,0,160,.7);
}

.prototype{
    margin-left:12px;
    padding-left:12px;
    border-left:1px solid #555;

    color:#ff0ca8;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1.5px;
}

.scoreBox{
    display:flex;
    align-items:center;
    gap:12px;
}

.scoreTitle{
    color:#00ddff;
    font-size:18px;
    font-weight:900;
}

.score{
    font-size:17px;
    font-weight:900;
}

.hudIcon{
    margin-left:15px;
    padding-left:15px;
    border-left:1px solid #444;
    font-size:21px;
}

/* =========================================================
   OBJECTIVE
========================================================= */

#objective{
    position:absolute;
    z-index:20;

    left:18px;
    bottom:18px;

    width:465px;
    min-height:70px;

    display:flex;
    align-items:center;

    padding:10px 15px;

    background:
        linear-gradient(
            90deg,
            rgba(0,8,18,.95),
            rgba(0,8,18,.75),
            transparent
        );

    border-top:1px solid rgba(0,210,255,.35);
    border-left:3px solid #ffd000;

    pointer-events:none;
}

.objectiveIcon{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:13px;

    border:3px solid #ffd000;
    border-radius:50%;

    color:#ffd000;
    font-size:25px;
    font-weight:900;
}

.objectiveTitle{
    color:#ffd000;
    font-size:12px;
    font-weight:900;
    margin-bottom:5px;
}

.objectiveText{
    font-size:14px;
    font-weight:700;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:absolute;
    z-index:30;

    left:28px;
    bottom:35px;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(16,38,58,.9),
            rgba(3,10,18,.9)
        );

    border:2px solid rgba(210,235,255,.55);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.6),
        0 10px 30px rgba(0,0,0,.55);
}

.joy{
    position:absolute;

    width:45px;
    height:45px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:transparent;
    border:0;

    color:#b9d9ea;
    font-size:25px;
}

.joy:active{
    color:#00ddff;
    transform:scale(.85);
}

.up{
    left:57px;
    top:4px;
}

.down{
    left:57px;
    bottom:4px;
}

.left{
    left:4px;
    top:57px;
}

.right{
    right:4px;
    top:57px;
}

.joyCenter{
    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    height:58px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #39eaff,
            #0087c8
        );

    border:2px solid white;

    box-shadow:
        0 0 18px #00d9ff,
        inset 0 0 12px rgba(255,255,255,.3);
}

/* =========================================================
   ACTION
========================================================= */

#action{
    position:absolute;
    z-index:30;

    right:36px;
    bottom:38px;

    width:115px;
    height:115px;

    border-radius:50%;

    border:2px solid #ff0baa;

    background:
        radial-gradient(
            circle,
            rgba(255,0,170,.65),
            rgba(70,0,50,.9)
        );

    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 0 25px rgba(255,0,170,.55),
        inset 0 0 25px rgba(255,0,170,.2);
}

.actionIcon{
    font-size:36px;
}

.actionText{
    font-size:12px;
    font-weight:900;
}

/* =========================================================
   DESKTOP HELP
========================================================= */

#help{
    position:absolute;
    z-index:20;

    right:20px;
    bottom:20px;

    width:385px;
    height:62px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    background:rgba(2,8,15,.85);

    border-top:1px solid rgba(0,200,255,.2);

    font-size:12px;
}

.keys{
    display:grid;
    grid-template-columns:24px 24px 24px;
    grid-template-rows:24px 24px;
    gap:2px;
}

.key{
    border:1px solid #8ca0ae;
    border-radius:4px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:bold;
}

.kw{
    grid-column:2;
}

.ka{
    grid-column:1;
    grid-row:2;
}

.ks{
    grid-column:2;
    grid-row:2;
}

.kd{
    grid-column:3;
    grid-row:2;
}

.divider{
    width:1px;
    height:30px;
    background:#444;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    #hud{
        height:58px;
        padding:6px 12px;
    }

    .logo{
        font-size:18px;
    }

    .prototype{
        font-size:7px;
        margin-left:5px;
        padding-left:5px;
    }

    .scoreTitle{
        font-size:11px;
    }

    .score{
        font-size:12px;
    }

    .hudIcon{
        display:none;
    }

    #help{
        display:none;
    }

    #objective{
        left:10px;
        bottom:12px;

        width:calc(100% - 20px);

        min-height:52px;

        padding:7px 9px;
    }

    .objectiveIcon{
        width:34px;
        height:34px;
        min-width:34px;

        font-size:19px;
        margin-right:9px;
    }

    .objectiveTitle{
        font-size:8px;
    }

    .objectiveText{
        font-size:10px;
    }

    #joystick{
        left:14px;
        bottom:78px;

        width:135px;
        height:135px;
    }

    .up{
        left:45px;
    }

    .down{
        left:45px;
    }

    .left{
        top:45px;
    }

    .right{
        top:45px;
    }

    .joyCenter{
        width:50px;
        height:50px;
    }

    #action{
        right:15px;
        bottom:78px;

        width:100px;
        height:100px;
    }

    .actionIcon{
        font-size:29px;
    }

    .actionText{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="world"></canvas>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div>
        <span class="logo">
            PARTY NIGHT
            <span>CHAOS</span>
        </span>

        <span class="prototype">
            PROTOTYPE • NIGHT 01
        </span>
    </div>

    <div class="scoreBox">

        <span class="scoreTitle">
            SCORE
        </span>

        <span class="score" id="score">
            0
        </span>

        <span class="hudIcon">
            ⚙
        </span>

        <span class="hudIcon">
            ⏸
        </span>

    </div>

</div>


<!-- =====================================================
     OBJECTIVE
===================================================== -->

<div id="objective">

    <div class="objectiveIcon">
        !
    </div>

    <div>

        <div class="objectiveTitle">
            CURRENT OBJECTIVE
        </div>

        <div class="objectiveText">
            Find the VIP guest in the party hall
        </div>

    </div>

</div>


<!-- =====================================================
     JOYSTICK
===================================================== -->

<div id="joystick">

    <button class="joy up" data-key="up">
        ▲
    </button>

    <button class="joy left" data-key="left">
        ◀
    </button>

    <div class="joyCenter"></div>

    <button class="joy right" data-key="right">
        ▶
    </button>

    <button class="joy down" data-key="down">
        ▼
    </button>

</div>


<!-- =====================================================
     ACTION
===================================================== -->

<button id="action">

    <div class="actionIcon">
        🖐
    </div>

    <div class="actionText">
        ACTION
    </div>

</button>


<!-- HELP -->

<div id="help">

    <div class="keys">

        <div class="key kw">W</div>
        <div class="key ka">A</div>
        <div class="key ks">S</div>
        <div class="key kd">D</div>

    </div>

    <span>Move</span>

    <div class="divider"></div>

    <span style="font-size:22px">
        🖱
    </span>

    <span>Interact</span>

    <div class="divider"></div>

    <span style="font-size:20px">
        📱
    </span>

    <span>(Mobile)</span>

</div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("world");

const ctx =
    canvas.getContext("2d");

let W;
let H;

function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   WORLD
========================================================= */

const world = {
    width:1600,
    height:950
};

let camera = {
    x:0,
    y:0
};


/* =========================================================
   PLAYER
========================================================= */

const player = {
    x:790,
    y:475,

    speed:3.2,

    moving:false,

    direction:1
};


/* =========================================================
   INPUT
========================================================= */

const keys = {
    up:false,
    down:false,
    left:false,
    right:false
};


window.addEventListener(
    "keydown",
    e => {

        const k =
            e.key.toLowerCase();

        if(k==="w" || k==="arrowup")
            keys.up=true;

        if(k==="s" || k==="arrowdown")
            keys.down=true;

        if(k==="a" || k==="arrowleft")
            keys.left=true;

        if(k==="d" || k==="arrowright")
            keys.right=true;

        if(k==="e")
            interact();

    }
);


window.addEventListener(
    "keyup",
    e => {

        const k =
            e.key.toLowerCase();

        if(k==="w" || k==="arrowup")
            keys.up=false;

        if(k==="s" || k==="arrowdown")
            keys.down=false;

        if(k==="a" || k==="arrowleft")
            keys.left=false;

        if(k==="d" || k==="arrowright")
            keys.right=false;

    }
);


/* =========================================================
   MOBILE
========================================================= */

document
.querySelectorAll(".joy")
.forEach(btn => {

    const key =
        btn.dataset.key;

    const start = e => {

        e.preventDefault();

        keys[key]=true;

    };

    const stop = e => {

        e.preventDefault();

        keys[key]=false;

    };

    btn.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    btn.addEventListener(
        "touchend",
        stop,
        {passive:false}
    );

    btn.addEventListener(
        "touchcancel",
        stop,
        {passive:false}
    );

});


/* =========================================================
   SCORE
========================================================= */

let score=0;

function interact(){

    score += 10;

    document.getElementById(
        "score"
    ).textContent=score;

    const action =
        document.getElementById("action");

    action.style.transform =
        "scale(.9)";

    setTimeout(()=>{
        action.style.transform="";
    },130);

}

document
.getElementById("action")
.addEventListener(
    "click",
    interact
);


/* =========================================================
   DRAW HELPERS
========================================================= */

function rect(x,y,w,h,color){

    ctx.fillStyle=color;

    ctx.fillRect(
        x-camera.x,
        y-camera.y,
        w,
        h
    );

}


function strokeRect(
    x,y,w,h,color,width=2
){

    ctx.strokeStyle=color;
    ctx.lineWidth=width;

    ctx.strokeRect(
        x-camera.x,
        y-camera.y,
        w,
        h
    );

}


function text(
    value,
    x,
    y,
    size,
    color="#fff"
){

    ctx.fillStyle=color;

    ctx.font=
        `900 ${size}px Arial`;

    ctx.fillText(
        value,
        x-camera.x,
        y-camera.y
    );

}


/* =========================================================
   FLOOR
========================================================= */

function floor(
    x,y,w,h,
    base="#111820"
){

    rect(
        x,y,w,h,
        base
    );

    /* floor tiles */

    ctx.save();

    ctx.strokeStyle=
        "rgba(255,255,255,.045)";

    ctx.lineWidth=1;

    const size=38;

    for(
        let xx=x;
        xx<x+w;
        xx+=size
    ){

        ctx.beginPath();

        ctx.moveTo(
            xx-camera.x,
            y-camera.y
        );

        ctx.lineTo(
            xx-camera.x,
            y+h-camera.y
        );

        ctx.stroke();

    }

    for(
        let yy=y;
        yy<y+h;
        yy+=size
    ){

        ctx.beginPath();

        ctx.moveTo(
            x-camera.x,
            yy-camera.y
        );

        ctx.lineTo(
            x+w-camera.x,
            yy-camera.y
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================================================
   ROOM
========================================================= */

function room(
    x,y,w,h,
    title,
    color
){

    floor(
        x,y,w,h,
        color
    );

    rect(
        x,
        y,
        w,
        7,
        "#253746"
    );

    strokeRect(
        x,y,w,h,
        "rgba(95,170,205,.38)",
        3
    );

    rect(
        x+15,
        y+15,
        125,
        32,
        "rgba(0,4,8,.85)"
    );

    text(
        title,
        x+28,
        y+37,
        16,
        "#fff"
    );

}


/* =========================================================
   NEON LIGHT
========================================================= */

function glow(
    x,y,r,color
){

    const gradient =
        ctx.createRadialGradient(
            x-camera.x,
            y-camera.y,
            0,
            x-camera.x,
            y-camera.y,
            r
        );

    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        x-camera.x,
        y-camera.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   PARTY FLOOR
========================================================= */

function drawDanceFloor(){

    const x=70;
    const y=90;
    const w=480;
    const h=300;

    room(
        x,y,w,h,
        "PARTY HALL",
        "#16101e"
    );

    glow(
        300,
        235,
        230,
        "rgba(255,0,180,.20)"
    );

    glow(
        470,
        160,
        130,
        "rgba(80,0,255,.18)"
    );

    /* dance floor */

    for(
        let yy=175;
        yy<320;
        yy+=38
    ){

        for(
            let xx=175;
            xx<455;
            xx+=38
        ){

            const colors=[
                "#32113d",
                "#10254c",
                "#35104a",
                "#132b38"
            ];

            rect(
                xx,
                yy,
                34,
                34,
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ]
            );

        }

    }

    /* DJ stage */

    rect(
        205,
        115,
        210,
        45,
        "#080b11"
    );

    rect(
        225,
        125,
        170,
        25,
        "#172b42"
    );

    glow(
        310,
        135,
        80,
        "rgba(0,200,255,.35)"
    );

    text(
        "DJ",
        292,
        145,
        13,
        "#00ddff"
    );

    /* speakers */

    rect(
        170,
        118,
        27,
        55,
        "#08090d"
    );

    rect(
        425,
        118,
        27,
        55,
        "#08090d"
    );

}


/* =========================================================
   KITCHEN
========================================================= */

function drawKitchen(){

    room(
        580,
        90,
        350,
        300,
        "KITCHEN",
        "#182025"
    );

    /* cabinets */

    for(
        let i=0;
        i<6;
        i++
    ){

        rect(
            610+i*48,
            125,
            42,
            55,
            "#252d31"
        );

        strokeRect(
            610+i*48,
            125,
            42,
            55,
            "#56636a",
            1
        );

    }

    /* island */

    rect(
        650,
        225,
        210,
        65,
        "#252d31"
    );

    strokeRect(
        650,
        225,
        210,
        65,
        "#6a777b",
        2
    );

    /* stools */

    for(
        let i=0;
        i<4;
        i++
    ){

        ctx.fillStyle="#090d10";

        ctx.beginPath();

        ctx.arc(
            675+i*52-camera.x,
            310-camera.y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   BEDROOM
========================================================= */

function drawBedroom(){

    room(
        960,
        90,
        450,
        300,
        "BEDROOM",
        "#211a1b"
    );

    /* bed */

    rect(
        1070,
        145,
        235,
        115,
        "#292c35"
    );

    rect(
        1090,
        155,
        195,
        82,
        "#101827"
    );

    rect(
        1100,
        160,
        75,
        45,
        "#e5e5df"
    );

    rect(
        1200,
        160,
        75,
        45,
        "#e5e5df"
    );

    /* sofa */

    rect(
        1020,
        295,
        250,
        42,
        "#493f48"
    );

}


/* =========================================================
   LOUNGE
========================================================= */

function drawLounge(){

    room(
        70,
        445,
        500,
        370,
        "LOUNGE",
        "#171421"
    );

    glow(
        220,
        610,
        150,
        "rgba(180,0,255,.16)"
    );

    /* sofa */

    rect(
        130,
        560,
        340,
        75,
        "#30303d"
    );

    rect(
        145,
        545,
        310,
        42,
        "#3d3b4b"
    );

    /* table */

    ctx.fillStyle="#24252c";

    ctx.beginPath();

    ctx.ellipse(
        300-camera.x,
        685-camera.y,
        100,
        45,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   GARDEN
========================================================= */

function drawGarden(){

    room(
        610,
        445,
        510,
        370,
        "GARDEN",
        "#0b211d"
    );

    glow(
        850,
        625,
        250,
        "rgba(0,255,150,.10)"
    );

    /* grass patches */

    for(
        let i=0;
        i<25;
        i++
    ){

        const xx=
            630+
            Math.random()*460;

        const yy=
            470+
            Math.random()*320;

        rect(
            xx,
            yy,
            3,
            12,
            "#1e684c"
        );

    }

    /* fire */

    glow(
        850,
        650,
        100,
        "rgba(255,100,0,.25)"
    );

    ctx.fillStyle="#ff7b00";

    ctx.beginPath();

    ctx.arc(
        850-camera.x,
        650-camera.y,
        22,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   STORAGE
========================================================= */

function drawStorage(){

    room(
        1160,
        445,
        250,
        370,
        "STORAGE",
        "#10161a"
    );

    for(
        let y=510;
        y<750;
        y+=55
    ){

        rect(
            1200,
            y,
            160,
            38,
            "#252c30"
        );

        strokeRect(
            1200,
            y,
            160,
            38,
            "#566169",
            1
        );

    }

}


/* =========================================================
   WALLS / PATH
========================================================= */

function drawCentralPath(){

    rect(
        550,
        390,
        610,
        55,
        "#252d32"
    );

    strokeRect(
        550,
        390,
        610,
        55,
        "#52646d",
        2
    );

}


/* =========================================================
   POOL
========================================================= */

function drawPool(){

    rect(
        1210,
        610,
        160,
        145,
        "#08151d"
    );

    rect(
        1220,
        620,
        140,
        125,
        "#008fc1"
    );

    glow(
        1290,
        680,
        130,
        "rgba(0,200,255,.20)"
    );

    for(
        let y=635;
        y<735;
        y+=20
    ){

        ctx.strokeStyle=
            "rgba(255,255,255,.18)";

        ctx.beginPath();

        ctx.moveTo(
            1225-camera.x,
            y-camera.y
        );

        ctx.quadraticCurveTo(
            1260-camera.x,
            y-8-camera.y,
            1290-camera.x,
            y-camera.y
        );

        ctx.quadraticCurveTo(
            1320-camera.x,
            y+8-camera.y,
            1355-camera.x,
            y-camera.y
        );

        ctx.stroke();

    }

}


/* =========================================================
   TABLE
========================================================= */

function table(x,y){

    ctx.fillStyle="#2b2522";

    ctx.beginPath();

    ctx.arc(
        x-camera.x,
        y-camera.y,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#80624a";
    ctx.lineWidth=2;

    ctx.stroke();

}

/* =========================================================
   DRAW NPC
========================================================= */

function drawNPC(n){

    const x=n.x-camera.x;
    const y=n.y-camera.y;

    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+16,
        15,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* body */

    ctx.fillStyle=n.color;

    ctx.fillRect(
        x-7,
        y-1,
        14,
        22
    );

    /* head */

    ctx.fillStyle="#bd805f";

    ctx.beginPath();

    ctx.arc(
        x,
        y-8,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* hair */

    ctx.fillStyle="#141414";

    ctx.beginPath();

    ctx.arc(
        x,
        y-11,
        8,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* legs */

    ctx.strokeStyle="#16191d";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(x-4,y+20);
    ctx.lineTo(x-5,y+31);

    ctx.moveTo(x+4,y+20);
    ctx.lineTo(x+5,y+31);

    ctx.stroke();

}


/* =========================================================
   VIP
========================================================= */

const vip={

};

function drawVIP(){

/* =========================================================
   ALEX
========================================================= */

function drawPlayer(){

    const x=
        player.x-camera.x;

    const y=
        player.y-camera.y;

    /* glow */

    glow(
        player.x,
        player.y+18,
        60,
        "rgba(0,210,255,.18)"
    );

    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.65)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+31,
        25,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* blue ring */

    ctx.strokeStyle="#00ddff";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+30,
        23,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /* legs */

    ctx.strokeStyle="#15191e";
    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
        x-6,
        y+16
    );

    ctx.lineTo(
        x-9,
        y+30
    );

    ctx.moveTo(
        x+6,
        y+16
    );

    ctx.lineTo(
        x+9,
        y+30
    );

    ctx.stroke();

    /* shoes */

    ctx.strokeStyle="#f1f1f1";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        x-13,
        y+31
    );

    ctx.lineTo(
        x-4,
        y+31
    );

    ctx.moveTo(
        x+4,
        y+31
    );

    ctx.lineTo(
        x+14,
        y+31
    );

    ctx.stroke();

    /* body */

    ctx.fillStyle="#11151a";

    ctx.beginPath();

    ctx.roundRect(
        x-14,
        y-8,
        28,
        30,
        7
    );

    ctx.fill();

    /* white shirt */

    ctx.fillStyle="#eeeeee";

    ctx.beginPath();

    ctx.moveTo(
        x-5,
        y-5
    );

    ctx.lineTo(
        x+5,
        y-5
    );

    ctx.lineTo(
        x+7,
        y+17
    );

    ctx.lineTo(
        x-7,
        y+17
    );

    ctx.closePath();

    ctx.fill();

    /* neck */

    ctx.fillStyle="#9e6048";

    ctx.fillRect(
        x-5,
        y-14,
        10,
        9
    );

    /* head */

    ctx.fillStyle="#c48665";

    ctx.beginPath();

    ctx.arc(
        x,
        y-23,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* hair */

    ctx.fillStyle="#08090b";

    ctx.beginPath();

    ctx.arc(
        x,
        y-29,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* glasses */

    ctx.fillStyle="#050607";

    ctx.fillRect(
        x-17,
        y-25,
        14,
        7
    );

    ctx.fillRect(
        x+3,
        y-25,
        14,
        7
    );

    ctx.fillStyle="#555";

    ctx.fillRect(
        x-3,
        y-23,
        6,
        2
    );

    /* name */

    ctx.font="bold 10px Arial";

    ctx.fillStyle="#dffbff";

    ctx.textAlign="center";

    ctx.fillText(
        "ALEX • LV 01",
        x,
        y-49
    );

    ctx.textAlign="left";

}


/* =========================================================
   BUILD WORLD
========================================================= */

function drawWorld(){

    /* background */

    rect(
        0,
        0,
        world.width,
        world.height,
        "#070d12"
    );

    /* rooms */

    drawDanceFloor();

    drawKitchen();

    drawBedroom();

    drawLounge();

    drawGarden();

    drawStorage();

    drawCentralPath();

    drawPool();

    /* tables */

    table(125,500);
    table(480,500);
    table(690,515);
    table(1040,530);
    table(760,730);
    table(930,730);

    /* VIP */

    drawVIP();

    /* NPCs */

    npcs.forEach(
        drawNPC
    );

    /* player */

    drawPlayer();

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.x =
        player.x -
        W/2;

    camera.y =
        player.y -
        H/2;

    camera.x =
        Math.max(
            0,
            Math.min(
                world.width-W,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                world.height-H,
                camera.y
            )
        );

}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

    player.moving=false;

    if(keys.up){

        player.y -=
            player.speed;

        player.moving=true;

    }

    if(keys.down){

        player.y +=
            player.speed;

        player.moving=true;

    }

    if(keys.left){

        player.x -=
            player.speed;

        player.direction=-1;

        player.moving=true;

    }

    if(keys.right){

        player.x +=
            player.speed;

        player.direction=1;

        player.moving=true;

    }


    /* world limits */

    player.x=
        Math.max(
            25,
            Math.min(
                world.width-25,
                player.x
            )
        );

    player.y=
        Math.max(
            90,
            Math.min(
                world.height-30,
                player.y
            )
        );


    /* NPC tiny movement */

    npcs.forEach(n=>{

        n.timer += .01;

        if(n.timer>2){

            n.dir +=
                (Math.random()-.5);

            n.timer=0;

        }

    });

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    updatePlayer();

    updateCamera();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawWorld();

    requestAnimationFrame(
        loop
    );

}

loop();
