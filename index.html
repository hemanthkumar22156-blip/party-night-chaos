<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PARTY NIGHT CHAOS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05060b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    touch-action:none;
}

/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,#111827 0%,#070910 48%,#020307 100%);
}

/* Background grid */

#game::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(0,220,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,220,255,.045) 1px,transparent 1px);

    background-size:45px 45px;
    pointer-events:none;
}

/* =========================
   TOP UI
========================= */

#topbar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:linear-gradient(
        180deg,
        rgba(2,4,10,.96),
        rgba(2,4,10,.70)
    );

    border-bottom:1px solid rgba(0,220,255,.15);

    z-index:20;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#ff1593;
}

.level{
    font-size:13px;
    color:#7e8aa5;
    margin-top:4px;
}

.stats{
    display:flex;
    align-items:center;
    gap:24px;
}

.stat{
    min-width:130px;
}

.stat-title{
    font-size:11px;
    color:#7f8ca5;
    margin-bottom:5px;
}

.bar{
    width:130px;
    height:8px;
    background:#151a25;
    border-radius:10px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    border-radius:10px;
}

.hp{
    width:88%;
    background:#ff2d6f;
}

.energy{
    width:76%;
    background:#00d9ff;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;

    left:50%;
    top:50%;

    width:min(1400px,92vw);
    height:min(780px,78vh);

    transform:translate(-50%,-47%);

    border:1px solid rgba(100,130,180,.18);

    background:
        radial-gradient(circle at 50% 50%,rgba(25,35,55,.45),transparent 70%);

    overflow:hidden;
}

/* Rooms */

.room{
    position:absolute;

    border:2px solid rgba(92,118,165,.55);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.25),
        0 0 20px rgba(0,0,0,.15);

    overflow:hidden;
}

.room::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.025),
            transparent 50%
        );

    pointer-events:none;
}

.room-title{
    position:absolute;
    left:18px;
    top:16px;

    padding:9px 15px;

    background:rgba(3,5,10,.92);

    font-size:14px;
    font-weight:900;
    letter-spacing:1px;

    border-left:3px solid #00d9ff;

    z-index:3;
}

.party{
    left:2%;
    top:4%;
    width:30%;
    height:38%;
    background:#251035;
}

.kitchen{
    left:35%;
    top:4%;
    width:30%;
    height:38%;
    background:#0d2b32;
}

.bedroom{
    left:68%;
    top:4%;
    width:30%;
    height:38%;
    background:#251a30;
}

.bar{
    left:2%;
    top:47%;
    width:30%;
    height:48%;
    background:#281919;
}

.lounge{
    left:35%;
    top:47%;
    width:30%;
    height:48%;
    background:#151d38;
}

.garden{
    left:68%;
    top:47%;
    width:30%;
    height:48%;
    background:#063024;
}

/* Party floor lights */

.floor-light{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:4px;
    background:#4a0f52;
    box-shadow:0 0 15px rgba(255,0,200,.08);
}

/* =========================
   ALEX CHARACTER
========================= */

#player{
    position:absolute;

    width:72px;
    height:108px;

    left:45%;
    top:55%;

    z-index:10;

    transform:translate(-50%,-50%);
    transition:transform .06s linear;

    filter:drop-shadow(0 12px 7px rgba(0,0,0,.55));
}

/* character shadow */

.player-shadow{
    position:absolute;

    width:62px;
    height:18px;

    left:5px;
    bottom:0;

    border-radius:50%;

    background:rgba(0,0,0,.55);

    filter:blur(5px);
}

/* glow */

.player-glow{
    position:absolute;

    width:110px;
    height:110px;

    left:-19px;
    top:-2px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(0,217,255,.12),
        transparent 65%
    );

    pointer-events:none;
}

/* head */

.head{
    position:absolute;

    width:38px;
    height:39px;

    left:17px;
    top:5px;

    border-radius:45% 45% 48% 48%;

    background:#b96d43;

    z-index:5;
}

/* hair */

.hair{
    position:absolute;

    width:40px;
    height:22px;

    left:16px;
    top:1px;

    background:#171116;

    border-radius:60% 60% 35% 30%;

    z-index:7;

    transform:rotate(-3deg);
}

/* hair spikes */

.hair::after{
    content:"";

    position:absolute;

    left:2px;
    top:-5px;

    width:13px;
    height:15px;

    background:#171116;

    clip-path:polygon(
        0 100%,
        30% 0,
        55% 65%,
        78% 10%,
        100% 100%
    );
}

/* glasses */

.glasses{
    position:absolute;

    width:42px;
    height:13px;

    left:15px;
    top:20px;

    z-index:9;
}

.glasses::before,
.glasses::after{
    content:"";

    position:absolute;

    width:18px;
    height:10px;

    background:#050609;

    border:1px solid #555;

    border-radius:4px;
}

.glasses::before{
    left:0;
}

.glasses::after{
    right:0;
}

.glass-line{
    position:absolute;

    left:17px;
    top:4px;

    width:8px;
    height:2px;

    background:#111;
}

/* neck */

.neck{
    position:absolute;

    width:15px;
    height:13px;

    left:29px;
    top:37px;

    background:#a9613d;

    z-index:3;
}

/* hoodie body */

.body{
    position:absolute;

    left:12px;
    top:42px;

    width:48px;
    height:48px;

    background:#11151d;

    border-radius:12px 12px 9px 9px;

    border:1px solid #242b38;

    z-index:4;
}

/* white shirt */

.shirt{
    position:absolute;

    left:25px;
    top:43px;

    width:22px;
    height:40px;

    background:#f2f3f5;

    clip-path:polygon(
        28% 0,
        72% 0,
        100% 100%,
        0 100%
    );

    z-index:5;
}

/* hoodie strings */

.string{
    position:absolute;

    width:2px;
    height:18px;

    top:43px;

    background:#bfc6d4;

    z-index:8;
}

.string.left{
    left:27px;
}

.string.right{
    left:43px;
}

/* left arm */

.arm{
    position:absolute;

    width:14px;
    height:43px;

    top:46px;

    background:#151923;

    border-radius:9px;

    z-index:3;
}

.arm.left{
    left:2px;
    transform:rotate(5deg);
}

.arm.right{
    right:2px;
    transform:rotate(-5deg);
}

/* hands */

.hand{
    position:absolute;

    width:12px;
    height:13px;

    top:82px;

    border-radius:50%;

    background:#b96d43;

    z-index:5;
}

.hand.left{
    left:3px;
}

.hand.right{
    right:3px;
}

/* pants */

.pants{
    position:absolute;

    left:17px;
    top:85px;

    width:38px;
    height:25px;

    z-index:3;
}

.leg{
    position:absolute;

    width:17px;
    height:27px;

    background:#1a202b;

    border-radius:3px;

    bottom:0;
}

.leg.left{
    left:0;
}

.leg.right{
    right:0;
}

/* shoes */

.shoe{
    position:absolute;

    width:23px;
    height:9px;

    bottom:-2px;

    background:#f4f5f7;

    border-radius:5px 8px 4px 4px;

    z-index:8;
}

.shoe.left{
    left:11px;
}

.shoe.right{
    right:8px;
}

/* walking animation */

.walking .leg.left{
    animation:walkLeft .18s infinite alternate;
}

.walking .leg.right{
    animation:walkRight .18s infinite alternate;
}

.walking .arm.left{
    animation:armLeft .18s infinite alternate;
}

.walking .arm.right{
    animation:armRight .18s infinite alternate;
}

@keyframes walkLeft{
    from{transform:translateY(0) rotate(8deg)}
    to{transform:translateY(-3px) rotate(-8deg)}
}

@keyframes walkRight{
    from{transform:translateY(-3px) rotate(-8deg)}
    to{transform:translateY(0) rotate(8deg)}
}

@keyframes armLeft{
    from{transform:rotate(12deg)}
    to{transform:rotate(-12deg)}
}

@keyframes armRight{
    from{transform:rotate(-12deg)}
    to{transform:rotate(12deg)}
}

/* =========================
   NAME TAG
========================= */

.name-tag{
    position:absolute;

    left:50%;
    top:-26px;

    transform:translateX(-50%);

    padding:5px 10px;

    background:rgba(3,5,10,.9);

    border:1px solid rgba(0,217,255,.5);

    border-radius:5px;

    font-size:10px;
    font-weight:bold;

    color:#00d9ff;

    white-space:nowrap;
}

/* =========================
   OBJECTIVE
========================= */

.objective{
    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    background:#ffc107;

    box-shadow:
        0 0 10px #ffc107,
        0 0 30px rgba(255,193,7,.7);

    z-index:4;

    left:86%;
    top:83%;

    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(.85)}
    to{transform:scale(1.15)}
}

/* =========================
   BOTTOM UI
========================= */

#objectiveText{
    position:absolute;

    left:28px;
    bottom:22px;

    z-index:20;
}

.obj-title{
    color:#ffc107;
    font-size:12px;
    font-weight:900;
    margin-bottom:5px;
}

.obj-desc{
    color:#d8dce5;
    font-size:14px;
}

/* =========================
   MOBILE CONTROLS
========================= */

#controls{
    display:none;

    position:absolute;

    left:25px;
    bottom:25px;

    width:145px;
    height:145px;

    z-index:30;
}

.control{
    position:absolute;

    width:48px;
    height:48px;

    border-radius:14px;

    border:1px solid rgba(0,217,255,.4);

    background:rgba(5,10,20,.8);

    color:#00d9ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:bold;

    user-select:none;

    -webkit-tap-highlight-color:transparent;
}

.control:active{
    background:rgba(0,217,255,.22);
    transform:scale(.94);
}

.up{
    left:49px;
    top:0;
}

.down{
    left:49px;
    bottom:0;
}

.left{
    left:0;
    top:49px;
}

.right{
    right:0;
    top:49px;
}

/* action */

#actionBtn{
    display:none;

    position:absolute;

    right:28px;
    bottom:45px;

    width:76px;
    height:76px;

    border-radius:50%;

    border:2px solid rgba(255,21,147,.65);

    background:rgba(255,21,147,.14);

    color:#ff1593;

    font-weight:900;

    z-index:30;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    #topbar{
        height:60px;
        padding:0 14px;
    }

    .logo{
        font-size:16px;
    }

    .level{
        font-size:9px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        min-width:75px;
    }

    .bar{
        width:75px;
        height:6px;
    }

    #map{
        width:96vw;
        height:75vh;

        top:48%;
    }

    .room-title{
        left:7px;
        top:7px;

        padding:5px 8px;

        font-size:8px;
    }

    #controls{
        display:block;
    }

    #actionBtn{
        display:block;
    }

    #objectiveText{
        left:14px;
        bottom:12px;
    }

    .obj-title{
        font-size:9px;
    }

    .obj-desc{
        font-size:10px;
    }

    #player{
        transform:translate(-50%,-50%) scale(.78);
    }
}

@media(min-width:701px){
    #map{
        min-width:900px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- TOP BAR -->
    <div id="topbar">

        <div>
            <div class="logo">
                PARTY NIGHT <span>CHAOS</span>
            </div>

            <div class="level">
                NIGHT 01 • THE HOUSE PARTY
            </div>
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">HEALTH</div>
                <div class="bar">
                    <div class="bar-fill hp"></div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">ENERGY</div>
                <div class="bar">
                    <div class="bar-fill energy"></div>
                </div>
            </div>

        </div>

    </div>


    <!-- MAP -->

    <div id="map">

        <div class="room party">
            <div class="room-title">PARTY HALL</div>

            <div class="floor-light" style="left:18%;top:30%"></div>
            <div class="floor-light" style="left:35%;top:30%"></div>
            <div class="floor-light" style="left:52%;top:30%"></div>
            <div class="floor-light" style="left:69%;top:30%"></div>

            <div class="floor-light" style="left:18%;top:52%"></div>
            <div class="floor-light" style="left:35%;top:52%"></div>
            <div class="floor-light" style="left:52%;top:52%"></div>
            <div class="floor-light" style="left:69%;top:52%"></div>

        </div>

        <div class="room kitchen">
            <div class="room-title">KITCHEN</div>
        </div>

        <div class="room bedroom">
            <div class="room-title">BEDROOM</div>
        </div>

        <div class="room bar">
            <div class="room-title">BAR</div>
        </div>

        <div class="room lounge">
            <div class="room-title">LOUNGE</div>
        </div>

        <div class="room garden">
            <div class="room-title">GARDEN</div>
        </div>


        <!-- OBJECTIVE -->

        <div class="objective"></div>


        <!-- ALEX -->

        <div id="player">

            <div class="player-glow"></div>

            <div class="name-tag">
                ALEX • LV 01
            </div>

            <div class="player-shadow"></div>

            <div class="hair"></div>

            <div class="head"></div>

            <div class="glasses">
                <div class="glass-line"></div>
            </div>

            <div class="neck"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="body"></div>

            <div class="shirt"></div>

            <div class="string left"></div>
            <div class="string right"></div>

            <div class="hand left"></div>
            <div class="hand right"></div>

            <div class="pants">
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="shoe left"></div>
            <div class="shoe right"></div>

        </div>

    </div>


    <!-- OBJECTIVE -->

    <div id="objectiveText">
        <div class="obj-title">OBJECTIVE</div>
        <div class="obj-desc">
            Reach the yellow objective
        </div>
    </div>


    <!-- MOBILE CONTROLS -->

    <div id="controls">

        <div class="control up" data-key="up">▲</div>
        <div class="control left" data-key="left">◀</div>
        <div class="control right" data-key="right">▶</div>
        <div class="control down" data-key="down">▼</div>

    </div>

    <button id="actionBtn">
        ACTION
    </button>

</div>


<script>

/* =====================================================
   PARTY NIGHT CHAOS
   ALEX CHARACTER CONTROLLER
===================================================== */

const player = document.getElementById("player");
const map = document.getElementById("map");

let x = 45;
let y = 55;

let speed = 0.55;

const keys = {
    up:false,
    down:false,
    left:false,
    right:false
};


/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",(e)=>{

    const key = e.key.toLowerCase();

    if(key === "w" || key === "arrowup"){
        keys.up = true;
    }

    if(key === "s" || key === "arrowdown"){
        keys.down = true;
    }

    if(key === "a" || key === "arrowleft"){
        keys.left = true;
    }

    if(key === "d" || key === "arrowright"){
        keys.right = true;
    }

});


window.addEventListener("keyup",(e)=>{

    const key = e.key.toLowerCase();

    if(key === "w" || key === "arrowup"){
        keys.up = false;
    }

    if(key === "s" || key === "arrowdown"){
        keys.down = false;
    }

    if(key === "a" || key === "arrowleft"){
        keys.left = false;
    }

    if(key === "d" || key === "arrowright"){
        keys.right = false;
    }

});


/* =========================
   MOBILE
========================= */

document.querySelectorAll(".control").forEach(button=>{

    const direction = button.dataset.key;

    const start = (e)=>{
        e.preventDefault();
        keys[direction] = true;
    };

    const end = (e)=>{
        e.preventDefault();
        keys[direction] = false;
    };

    button.addEventListener("touchstart",start,{passive:false});
    button.addEventListener("touchend",end,{passive:false});
    button.addEventListener("touchcancel",end,{passive:false});

    button.addEventListener("mousedown",start);
    button.addEventListener("mouseup",end);
    button.addEventListener("mouseleave",end);

});


/* =========================
   PLAYER MOVEMENT
========================= */

function update(){

    let moving = false;

    if(keys.up){
        y -= speed;
        moving = true;
    }

    if(keys.down){
        y += speed;
        moving = true;
    }

    if(keys.left){
        x -= speed;
        moving = true;

        player.style.transform =
            "translate(-50%,-50%) scaleX(-1)";
    }

    if(keys.right){
        x += speed;
        moving = true;

        player.style.transform =
            "translate(-50%,-50%) scaleX(1)";
    }


    /* boundaries */

    x = Math.max(4,Math.min(96,x));
    y = Math.max(9,Math.min(91,y));


    player.style.left = x + "%";
    player.style.top = y + "%";


    if(moving){
        player.classList.add("walking");
    }else{
        player.classList.remove("walking");
    }


    requestAnimationFrame(update);
}

update();


/* =========================
   ACTION BUTTON
========================= */

document.getElementById("actionBtn").addEventListener("click",()=>{

    const button = document.getElementById("actionBtn");

    button.innerText = "✓";

    setTimeout(()=>{
        button.innerText = "ACTION";
    },700);

});


/* =========================
   DESKTOP ACTION
========================= */

window.addEventListener("keydown",(e)=>{

    if(e.key === "e" || e.key === "E"){

        console.log("Alex Action");

    }

});

</script>

</body>
</html>
