========================================================= */

        scene,
        450,80,

        scene,
        880,80,
        330,270,
        0x291c35,
        "BEDROOM"
    );

    createRoom(
        scene,
        450,390,
        380,250,
        0x171e34,
        "LOUNGE"
    );

    createRoom(
        scene,
        880,390,
        330,250,
        0x102d22,
        "GARDEN"
    );


    /* WALLS */

    walls =
        scene.physics.add.staticGroup();

    addWall(scene,640,45,1180,25);
    addWall(scene,640,675,1180,25);

    addWall(scene,45,360,25,630);
    addWall(scene,1235,360,25,630);

    addWall(scene,430,210,20,260);
    addWall(scene,430,560,20,150);

    addWall(scene,860,560,20,150);


    /* MAIN CHARACTER */

    player =

        player,
        walls

    createNPC(scene,300,250,0xff3d8d);

    createNPC(scene,720,250,0xffc107);

            1080,
            570,

            0xffd000
        );

    objective.setStrokeStyle(
        3,
        0xffffff,
        0.9
    );

    scene.tweens.add({

        targets:objective,

        scale:1.45,
        alpha:0.45,

        duration:700,

        yoyo:true,
        repeat:-1
    });


    /* KEYBOARD */

    cursors =
        scene.input.keyboard.createCursorKeys();

    keys =
        scene.input.keyboard.addKeys({

            W:Phaser.Input.Keyboard.KeyCodes.W,
            A:Phaser.Input.Keyboard.KeyCodes.A,
            S:Phaser.Input.Keyboard.KeyCodes.S,
            D:Phaser.Input.Keyboard.KeyCodes.D
        });


    /* UI */

    createUI(scene);


    /* MOBILE */

    createMobileControls(scene);

}


/* =========================================================
   UPDATE
========================================================= */

function update(time,delta){

    if(!player){
        return;
    }

    let x = 0;
    let y = 0;

    const speed = 220;


    /* KEYBOARD */

    if(
        cursors.left.isDown ||
        keys.A.isDown
    ){
        x -= 1;
    }

    if(
        cursors.right.isDown ||
        keys.D.isDown
    ){
        x += 1;
    }

    if(
        cursors.up.isDown ||
        keys.W.isDown
    ){
        y -= 1;
    }

    if(
        cursors.down.isDown ||
        keys.S.isDown
    ){
        y += 1;
    }


    /* MOBILE */

    if(joystickActive){

        x = joystickX;
        y = joystickY;

    }


    const direction =
        new Phaser.Math.Vector2(
            x,
            y
        );


    if(direction.length() > 0){

        direction.normalize();

        player.body.setVelocity(
            direction.x * speed,
            direction.y * speed
        );

        player.walking = true;


        /* DIRECTION */

        if(direction.x < -0.1){

            player.scaleX =
                -1;

            player.facing =
                "left";

        }

        else if(direction.x > 0.1){

            player.scaleX =
                1;

            player.facing =
                "right";

        }

    }

    else{

        player.body.setVelocity(
            0,
            0
        );

        player.walking = false;

    }


    animatePlayer(
        player,
        time
    );


    /* OBJECTIVE */

    const distance =
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );


    if(distance < 48){

        missionText.setText(
            "MISSION COMPLETE  +100"
        );

        missionText.setColor(
            "#00ff9d"
        );

        if(!objective.completed){

            objective.completed = true;

            score += 100;

            scoreText.setText(
                "SCORE  " + score
            );
        }

    }

    else{

        missionText.setText(
            "Reach the yellow objective"
        );

        missionText.setColor(
            "#ffffff"
        );

    }


    /* NPC AI */

    npcs.forEach(function(npc){

        npc.timer -= delta;

        if(npc.timer <= 0){

            npc.timer =
                Phaser.Math.Between(
                    1200,
                    3000
                );

            npc.targetX =
                Phaser.Math.Between(
                    100,
                    1150
                );

            npc.targetY =
                Phaser.Math.Between(
                    120,
                    600
                );
        }


        const angle =
            Phaser.Math.Angle.Between(
                npc.x,
                npc.y,
                npc.targetX,
                npc.targetY
            );


        npc.body.setVelocity(
            Math.cos(angle) * 35,
            Math.sin(angle) * 35
        );

    });

}

/* =========================================================
   PLAYER ANIMATION
========================================================= */

function animatePlayer(player,time){

    if(!player){
        return;
    }


    if(player.walking){

        player.walkCycle += 0.22;


        const walk =
            Math.sin(
                player.walkCycle
            );


        /* BODY BOB */

        player.y +=
            Math.sin(
                time * 0.025
            ) * 0.04;


        /* ARMS */

        player.leftArm.rotation =
            walk * 0.18;

        player.rightArm.rotation =
            -walk * 0.18;


        /* LEGS */

        player.leftLeg.rotation =
            walk * 0.12;

        player.rightLeg.rotation =
            -walk * 0.12;


        /* SHOES */

        player.leftShoe.rotation =
            walk * 0.10;

        player.rightShoe.rotation =
            -walk * 0.10;

    }

    else{

        /* IDLE BREATHING */

        const breathe =
            Math.sin(
                time * 0.003
            ) * 0.8;


        player.leftArm.rotation =
            breathe * 0.01;

        player.rightArm.rotation =
            -breathe * 0.01;


        player.leftLeg.rotation = 0;
        player.rightLeg.rotation = 0;

    }


    /* GLOW FOLLOW */

    if(player.glow){

        player.glow.x =
            player.x;

        player.glow.y =
            player.y;

    }

}


/* =========================================================
   NPC
========================================================= */

function createNPC(
    scene,
    x,
    y,
    color
){

    const npc =
        scene.add.circle(
            x,
            y,
            13,
            color
        );


    npc.setStrokeStyle(
        2,
        0xffffff,
        0.7
    );


    scene.physics.add.existing(
        npc
    );


    npc.body.setCircle(
        13
    );


    npc.body.setCollideWorldBounds(
        true
    );


    scene.physics.add.collider(
        npc,
        walls
    );


    npc.targetX = x;
    npc.targetY = y;

    npc.timer = 0;


    npcs.push(npc);

}


/* =========================================================
   ROOM
========================================================= */

function createRoom(
    scene,
    x,
    y,
    width,
    height,
    color,
    title
){

    const room =
        scene.add.rectangle(
            x + width / 2,
            y + height / 2,
            width,
            height,
            color
        );


    room.setStrokeStyle(
        2,
        0x4f5a72,
        0.8
    );


    scene.add.text(
        x + 15,
        y + 15,
        title,
        {

            fontFamily:"Arial",

            fontSize:"16px",

            fontStyle:"bold",

            color:"#ffffff",

            backgroundColor:"#05060acc",

            padding:{
                left:8,
                right:8,
                top:5,
                bottom:5
            }

        }
    );


    /* DANCE FLOOR */

    if(title === "PARTY HALL"){

        for(
            let px = x + 70;
            px < x + width - 40;
            px += 45
        ){

            for(
                let py = y + 80;
                py < y + height - 30;
                py += 45
            ){

                const tile =
                    scene.add.rectangle(
                        px,
                        py,
                        30,
                        30,
                        0xff238d,
                        0.15
                    );


                scene.tweens.add({

                    targets:tile,

                    alpha:0.35,

                    duration:
                        Phaser.Math.Between(
                            700,
                            1500
                        ),

                    yoyo:true,

                    repeat:-1

                });

            }

        }

    }

}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

function createMobileControls(scene){

    /* JOYSTICK */

    joystickBase =
        scene.add.circle(
            105,
            610,
            65,
            0x111827,
            0.68
        );


    joystickBase.setStrokeStyle(
        3,
        0x00d9ff,
        0.65
    );


    joystickThumb =
        scene.add.circle(
            105,
            610,
            30,
            0x00d9ff,
            0.78
        );


    joystickThumb.setStrokeStyle(
        3,
        0xffffff,
        0.7
    );


    joystickBase.setInteractive();


    joystickBase.on(
        "pointerdown",
        function(pointer){

            joystickActive = true;

            joystickPointerId =
                pointer.id;

            updateJoystick(pointer);

        }
    );


    scene.input.on(
        "pointermove",
        function(pointer){

            if(
                joystickActive &&
                pointer.id === joystickPointerId
            ){

                updateJoystick(pointer);

            }

        }
    );


    scene.input.on(
        "pointerup",
        function(pointer){

            if(
                pointer.id === joystickPointerId
            ){

                joystickActive = false;

                joystickPointerId = null;

                joystickX = 0;
                joystickY = 0;

                joystickThumb.x =
                    joystickBase.x;

                joystickThumb.y =
                    joystickBase.y;

            }

        }
    );


    /* ACTION */

    interactButton =
        scene.add.circle(
            1175,
            610,
            55,
            0xff238d,
            0.75
        );


    interactButton.setStrokeStyle(
        3,
        0xffffff,
        0.75
    );


    interactButton.setInteractive();


    interactButton.on(
        "pointerdown",
        function(){

            actionPressed();

        }
    );


    scene.add.text(
        1175,
        610,
        "ACTION",
        {

            fontFamily:"Arial",

            fontSize:"13px",

            fontStyle:"bold",

            color:"#ffffff"

        }
    ).setOrigin(0.5);


    /* HIDE ON DESKTOP */

    setTimeout(function(){

        if(!isMobileDevice()){

            joystickBase.setVisible(false);
            joystickThumb.setVisible(false);
            interactButton.setVisible(false);

        }

    },300);

}


/* =========================================================
   JOYSTICK
========================================================= */

function updateJoystick(pointer){

    const dx =
        pointer.x -
        joystickBase.x;


    const dy =
        pointer.y -
        joystickBase.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const maxDistance = 45;


    let finalX = dx;
    let finalY = dy;


    if(distance > maxDistance){

        finalX =
            (dx / distance) *
            maxDistance;

        finalY =
            (dy / distance) *
            maxDistance;

    }


    joystickThumb.x =
        joystickBase.x +
        finalX;


    joystickThumb.y =
        joystickBase.y +
        finalY;


    joystickX =
        finalX / maxDistance;


    joystickY =
        finalY / maxDistance;

}


/* =========================================================
   ACTION
========================================================= */

function actionPressed(){

    const distance =
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );


    if(distance < 80){

        if(!objective.completed){

            objective.completed = true;

            score += 100;

        }


        scoreText.setText(
            "SCORE  " + score
        );


        missionText.setText(
            "MISSION COMPLETE!"
        );


        missionText.setColor(
            "#00ff9d"
        );

    }

}


/* =========================================================
   MOBILE CHECK
========================================================= */

function isMobileDevice(){

    return /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );

}
