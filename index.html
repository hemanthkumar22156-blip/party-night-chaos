<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PARTY NIGHT CHAOS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* ================= SELECT SCREEN ================= */

#selectScreen{
  position:absolute;
  inset:0;
  overflow:auto;
  background:
    radial-gradient(circle at 50% 0%,#201044 0,#090b14 38%,#030408 100%);
  padding:35px 4vw 45px;
  z-index:10;
}

.logo{
  text-align:center;
  font-size:clamp(28px,5vw,58px);
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:5px;
}

.logo span{
  color:#ff1590;
  text-shadow:0 0 20px #ff1590;
}

.subtitle{
  text-align:center;
  color:#7deaff;
  letter-spacing:4px;
  font-size:12px;
  margin-bottom:30px;
}

.characters{
  width:min(1250px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  min-height:360px;
  border:1px solid #29344d;
  border-radius:18px;
  background:linear-gradient(145deg,#111725,#080c15);
  padding:18px;
  position:relative;
  transition:.2s;
  cursor:pointer;
  box-shadow:0 12px 35px #0008;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#00d9ff;
}

.card.selected{
  border:2px solid #ff1590;
  box-shadow:
    0 0 0 2px #ff159033,
    0 0 35px #ff159066;
}

.gender{
  position:absolute;
  top:15px;
  left:15px;
  border:1px solid #00d9ff;
  color:#00d9ff;
  border-radius:20px;
  padding:5px 10px;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

.female{
  color:#ff45a8;
  border-color:#ff45a8;
}

.level{
  position:absolute;
  right:15px;
  top:15px;
  color:#ffd400;
  font-size:12px;
  font-weight:bold;
}

.avatar{
  width:150px;
  height:190px;
  margin:35px auto 8px;
  position:relative;
}

/* character */
.head{
  width:58px;
  height:64px;
  border-radius:45% 45% 42% 42%;
  background:#b8754d;
  position:absolute;
  left:46px;
  top:5px;
  z-index:3;
}

.hair{
  width:63px;
  height:30px;
  background:#211610;
  border-radius:50% 50% 25% 25%;
  position:absolute;
  left:43px;
  top:0;
  z-index:4;
}

.eye{
  width:6px;
  height:6px;
  background:#111;
  border-radius:50%;
  position:absolute;
  top:34px;
  z-index:5;
}

.eye.one{left:61px}
.eye.two{left:82px}

.body{
  width:72px;
  height:82px;
  position:absolute;
  top:67px;
  left:39px;
  border-radius:14px 14px 8px 8px;
  z-index:2;
}

.arm{
  width:18px;
  height:70px;
  background:#b8754d;
  border-radius:15px;
  position:absolute;
  top:75px;
  z-index:1;
}

.arm.left{left:25px;transform:rotate(7deg)}
.arm.right{left:107px;transform:rotate(-7deg)}

.leg{
  width:27px;
  height:68px;
  background:#121722;
  position:absolute;
  top:138px;
  border-radius:0 0 8px 8px;
}

.leg.left{left:43px}
.leg.right{left:80px}

.shoe{
  width:36px;
  height:12px;
  background:#eee;
  border-radius:10px;
  position:absolute;
  top:198px;
}

.shoe.left{left:36px}
.shoe.right{left:78px}

.name{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.role{
  color:#8e9bb7;
  margin:5px 0 15px;
  font-size:12px;
}

.stats{
  display:grid;
  gap:7px;
}

.stat{
  display:grid;
  grid-template-columns:55px 1fr;
  align-items:center;
  font-size:10px;
  color:#8d99ad;
}

.bar{
  height:7px;
  background:#222a39;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#00d9ff;
  border-radius:10px;
}

.selectBtn{
  width:100%;
  margin-top:17px;
  padding:12px;
  background:#0b101b;
  color:white;
  border:1px solid #35415a;
  border-radius:10px;
  cursor:pointer;
  letter-spacing:2px;
  font-weight:bold;
}

.selected .selectBtn{
  background:#ff1590;
  border-color:#ff1590;
}

/* ================= GAME ================= */

#gameScreen{
  display:none;
  position:absolute;
  inset:0;
  background:#06080d;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  padding:15px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(#030408dd,transparent);
  pointer-events:none;
  z-index:3;
}

.gameTitle{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.gameTitle span{
  color:#ff1590;
}

.score{
  color:#00dcff;
  font-size:20px;
  font-weight:bold;
}

.hud{
  position:absolute;
  left:20px;
  bottom:20px;
  width:210px;
  padding:13px;
  background:#090e18dd;
  border:1px solid #28354e;
  border-radius:12px;
  z-index:4;
}

.hudName{
  font-weight:bold;
  margin-bottom:8px;
}

.hudLabel{
  font-size:9px;
  color:#8290a8;
  margin-top:6px;
}

.hudBar{
  height:7px;
  background:#202839;
  border-radius:10px;
  overflow:hidden;
}

.hp{
  height:100%;
  width:100%;
  background:#ff3d68;
}

.energy{
  height:100%;
  width:100%;
  background:#00d9ff;
}

.objective{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#080c14dd;
  border:1px solid #34415c;
  border-radius:10px;
  padding:10px 18px;
  font-size:12px;
  color:#fff;
  z-index:4;
}

.objective b{
  color:#ffd000;
}

/* mobile controls */

.controls{
  position:absolute;
  right:18px;
  bottom:18px;
  width:150px;
  height:150px;
  z-index:5;
  display:none;
}

.control{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#111a29cc;
  border:1px solid #52627e;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  user-select:none;
}

.up{left:51px;top:0}
.left{left:0;top:51px}
.down{left:51px;top:102px}
.right{left:102px;top:51px}

.backBtn{
  position:absolute;
  right:20px;
  top:82px;
  z-index:5;
  background:#0b111d;
  color:#fff;
  border:1px solid #3b4965;
  border-radius:8px;
  padding:8px 13px;
}

/* responsive */

@media(max-width:800px){
  #selectScreen{
    padding:25px 14px 35px;
  }

  .characters{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card{
    min-height:315px;
    padding:12px;
  }

  .avatar{
    transform:scale(.82);
    transform-origin:center;
    margin-top:28px;
    margin-bottom:-5px;
  }

  .name{
    font-size:18px;
  }

  .role{
    font-size:10px;
  }

  .selectBtn{
    padding:10px;
  }
}

@media(max-width:520px){
  .characters{
    grid-template-columns:1fr;
    width:min(370px,100%);
  }

  .card{
    min-height:300px;
  }

  .controls{
    display:block;
  }

  .hud{
    left:10px;
    bottom:12px;
    width:170px;
  }

  .objective{
    bottom:175px;
    font-size:10px;
    white-space:nowrap;
  }

  .gameTitle{
    font-size:15px;
  }

  .score{
    font-size:15px;
  }
}

@media(min-width:521px){
  .controls{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= CHARACTER SELECT ================= -->

<section id="selectScreen">

  <div class="logo">
    PARTY NIGHT <span>CHAOS</span>
  </div>

  <div class="subtitle">
    NIGHT 01 • SELECT YOUR CHARACTER
  </div>

  <div class="characters" id="characters"></div>

</section>


<!-- ================= GAME ================= -->

<section id="gameScreen">

  <canvas id="gameCanvas"></canvas>

  <div class="topbar">
    <div class="gameTitle">
      PARTY NIGHT <span>CHAOS</span>
    </div>
    <div class="score">
      SCORE <span id="score">0</span>
    </div>
  </div>

  <button class="backBtn" onclick="backToSelect()">CHARACTERS</button>

  <div class="hud">
    <div class="hudName" id="hudName">ALEX</div>

    <div class="hudLabel">HEALTH</div>
    <div class="hudBar">
      <div class="hp"></div>
    </div>

    <div class="hudLabel">ENERGY</div>
    <div class="hudBar">
      <div class="energy"></div>
    </div>
  </div>

  <div class="objective">
    OBJECTIVE : <b>Reach the yellow objective</b>
  </div>

  <div class="controls">
    <div class="control up" data-key="ArrowUp">▲</div>
    <div class="control left" data-key="ArrowLeft">◀</div>
    <div class="control down" data-key="ArrowDown">▼</div>
    <div class="control right" data-key="ArrowRight">▶</div>
  </div>

</section>

</div>


<script>

/* =========================================================
   CHARACTER DATA
========================================================= */

const characters = [

  {
    name:"ALEX",
    gender:"MALE",
    role:"BALANCED • MAIN PLAYER",
    color:"#202838",
    speed:4,
    power:70,
    energy:75
  },

  {
    name:"RYAN",
    gender:"MALE",
    role:"FAST • RUNNER",
    color:"#1470ad",
    speed:6,
    power:55,
    energy:90
  },

  {
    name:"KAI",
    gender:"MALE",
    role:"STRONG • POWER",
    color:"#a41448",
    speed:3,
    power:95,
    energy:60
  },

  {
    name:"MAYA",
    gender:"FEMALE",
    role:"SMART • TECH",
    color:"#7130a2",
    speed:5,
    power:65,
    energy:95
  },

  {
    name:"ZARA",
    gender:"FEMALE",
    role:"AGILE • STREET",
    color:"#1375a8",
    speed:7,
    power:60,
    energy:85
  },

  {
    name:"NINA",
    gender:"FEMALE",
    role:"CALM • TACTICAL",
    color:"#176b58",
    speed:4,
    power:80,
    energy:80
  }

];

let selectedCharacter = 0;


/* =========================================================
   BUILD CHARACTER CARDS
========================================================= */

const characterContainer =
  document.getElementById("characters");

characters.forEach((c,index)=>{

  const card = document.createElement("div");

  card.className =
    "card" + (index===0 ? " selected" : "");

  card.onclick = ()=>{
    selectCharacter(index);
  };

  card.innerHTML = `

    <div class="gender ${c.gender==="FEMALE"?"female":""}">
      ${c.gender==="MALE"?"♂":"♀"} ${c.gender}
    </div>

    <div class="level">LV 01</div>

    <div class="avatar">

      <div class="hair"></div>

      <div class="head">
        <div class="eye one"></div>
        <div class="eye two"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="body"
           style="background:${c.color}">
      </div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="shoe left"></div>
      <div class="shoe right"></div>

    </div>

    <div class="name">${c.name}</div>

    <div class="role">${c.role}</div>

    <div class="stats">

      <div class="stat">
        SPEED
        <div class="bar">
          <div class="fill"
               style="width:${c.speed/7*100}%"></div>
        </div>
      </div>

      <div class="stat">
        POWER
        <div class="bar">
          <div class="fill"
               style="width:${c.power}%"></div>
        </div>
      </div>

      <div class="stat">
        ENERGY
        <div class="bar">
          <div class="fill"
               style="width:${c.energy}%"></div>
        </div>
      </div>

    </div>

    <button class="selectBtn">
      SELECT
    </button>
  `;

  characterContainer.appendChild(card);

});


function selectCharacter(index){

  selectedCharacter=index;

  document.querySelectorAll(".card")
    .forEach((card,i)=>{
      card.classList.toggle(
        "selected",
        i===index
      );
    });

  setTimeout(startGame,180);
}


/* =========================================================
   GAME ENGINE
========================================================= */

const selectScreen =
  document.getElementById("selectScreen");

const gameScreen =
  document.getElementById("gameScreen");

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let W=0;
let H=0;

let player={
  x:0,
  y:0,
  size:18
};

let objective={
  x:0,
  y:0,
  size:14
};

let keys={};

let score=0;

let gameRunning=false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  if(gameRunning){
    draw();
  }
}

window.addEventListener("resize",resize);


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  selectScreen.style.display="none";
  gameScreen.style.display="block";

  resize();

  const c=characters[selectedCharacter];

  document.getElementById("hudName").textContent=c.name;

  score=0;
  document.getElementById("score").textContent=score;

  player.x=W*0.18;
  player.y=H*0.70;

  objective.x=W*0.82;
  objective.y=H*0.70;

  gameRunning=true;

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   MAP
========================================================= */

function drawMap(){

  ctx.fillStyle="#070a10";
  ctx.fillRect(0,0,W,H);

  /* grid */

  ctx.strokeStyle="#111927";
  ctx.lineWidth=1;

  const grid=40;

  for(let x=0;x<W;x+=grid){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();

  }

  for(let y=0;y<H;y+=grid){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();

  }


  const margin=40;
  const gap=18;

  const roomW=(W-margin*2-gap*2)/3;

  const topY=110;
  const roomH=H*0.30;

  room(
    margin,
    topY,
    roomW,
    roomH,
    "PARTY HALL",
    "#261038"
  );

  room(
    margin+roomW+gap,
    topY,
    roomW,
    roomH,
    "KITCHEN",
    "#10323a"
  );

  room(
    margin+(roomW+gap)*2,
    topY,
    roomW,
    roomH,
    "BEDROOM",
    "#292038"
  );


  const bottomY=topY+roomH+35;
  const bottomH=Math.max(
    150,
    H-bottomY-35
  );

  room(
    margin,
    bottomY,
    roomW,
    bottomH,
    "BAR",
    "#301c1c"
  );

  room(
    margin+roomW+gap,
    bottomY,
    roomW,
    bottomH,
    "LOUNGE",
    "#151c35"
  );

  room(
    margin+(roomW+gap)*2,
    bottomY,
    roomW,
    bottomH,
    "GARDEN",
    "#0c3326"
  );


  /* party lights */

  for(let i=0;i<12;i++){

    const x=margin+30+
      (i%6)*45;

    const y=topY+70+
      Math.floor(i/6)*45;

    ctx.fillStyle=
      i%2===0
      ? "#ff159055"
      : "#00d9ff44";

    ctx.fillRect(x,y,20,20);
  }
}


function room(x,y,w,h,name,bg){

  ctx.fillStyle=bg;
  ctx.fillRect(x,y,w,h);

  ctx.strokeStyle="#34425e";
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);

  ctx.fillStyle="#05070b";
  ctx.fillRect(x+15,y+15,145,35);

  ctx.fillStyle="#fff";
  ctx.font="bold 15px Arial";
  ctx.fillText(name,x+28,y+38);
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

  const c=characters[selectedCharacter];

  const x=player.x;
  const y=player.y;

  ctx.save();

  /* shadow */

  ctx.fillStyle="#0008";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y+22,
    17,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.fillStyle="#111722";

  ctx.fillRect(
    x-12,
    y+3,
    10,
    20
  );

  ctx.fillRect(
    x+2,
    y+3,
    10,
    20
  );


  /* shoes */

  ctx.fillStyle="#eee";

  ctx.fillRect(
    x-14,
    y+20,
    13,
    5
  );

  ctx.fillRect(
    x+2,
    y+20,
    13,
    5
  );


  /* body */

  ctx.fillStyle=c.color;

  roundRect(
    ctx,
    x-17,
    y-25,
    34,
    35,
    8
  );


  /* arms */

  ctx.fillStyle="#b8754d";

  ctx.fillRect(
    x-23,
    y-20,
    7,
    27
  );

  ctx.fillRect(
    x+16,
    y-20,
    7,
    27
  );


  /* head */

  ctx.beginPath();

  ctx.fillStyle="#b8754d";

  ctx.arc(
    x,
    y-35,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle="#211610";

  ctx.beginPath();

  ctx.arc(
    x,
    y-41,
    15,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillRect(
    x-15,
    y-42,
    30,
    8
  );


  /* outline */

  ctx.strokeStyle="#fff";
  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.arc(
    x,
    y-35,
    14,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.restore();
}


/* =========================================================
   OBJECTIVE
========================================================= */

function drawObjective(){

  const pulse=
    1+
    Math.sin(Date.now()/180)*.12;

  ctx.save();

  ctx.shadowBlur=25;
  ctx.shadowColor="#ffd000";

  ctx.fillStyle="#ffd000";

  ctx.beginPath();

  ctx.arc(
    objective.x,
    objective.y,
    objective.size*pulse,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  ctx.fillStyle="#fff";

  ctx.font="bold 11px Arial";

  ctx.fillText(
    "ACTION",
    objective.x+20,
    objective.y+4
  );
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

  if(!gameRunning) return;

  update();
  draw();

  requestAnimationFrame(gameLoop);
}


function update(){

  const c=characters[selectedCharacter];

  let dx=0;
  let dy=0;

  if(keys["ArrowUp"] || keys["w"] || keys["W"])
    dy-=1;

  if(keys["ArrowDown"] || keys["s"] || keys["S"])
    dy+=1;

  if(keys["ArrowLeft"] || keys["a"] || keys["A"])
    dx-=1;

  if(keys["ArrowRight"] || keys["d"] || keys["D"])
    dx+=1;

  if(dx!==0 || dy!==0){

    const len=Math.hypot(dx,dy);

    dx/=len;
    dy/=len;

    player.x+=dx*c.speed;
    player.y+=dy*c.speed;

    score+=0.05;

    document.getElementById("score").textContent=
      Math.floor(score);
  }

  /* screen boundaries */

  player.x=
    Math.max(
      20,
      Math.min(W-20,player.x)
    );

  player.y=
    Math.max(
      90,
      Math.min(H-30,player.y)
    );


  /* objective collision */

  const distance=
    Math.hypot(
      player.x-objective.x,
      player.y-objective.y
    );

  if(distance<30){

    score+=100;

    document.getElementById("score").textContent=
      Math.floor(score);

    objective.x=
      100+
      Math.random()*(W-200);

    objective.y=
      130+
      Math.random()*(H-220);
  }
}


function draw(){

  drawMap();
  drawObjective();
  drawPlayer();
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{

  keys[e.key]=true;

});

window.addEventListener("keyup",e=>{

  keys[e.key]=false;

});


/* =========================================================
   MOBILE TOUCH
========================================================= */

document.querySelectorAll(".control")
.forEach(btn=>{

  const key=btn.dataset.key;

  const down=e=>{
    e.preventDefault();
    keys[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  btn.addEventListener("touchstart",down,{passive:false});
  btn.addEventListener("touchend",up,{passive:false});
  btn.addEventListener("touchcancel",up,{passive:false});

  btn.addEventListener("mousedown",down);
  btn.addEventListener("mouseup",up);
  btn.addEventListener("mouseleave",up);

});

function backToSelect(){

  gameRunning=false;

  gameScreen.style.display="none";
  selectScreen.style.display="block";

}


/* =========================================================
   HELPERS
========================================================= */

function roundRect(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();

  ctx.fill();
}
