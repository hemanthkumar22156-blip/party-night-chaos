<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Party Night Chaos</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090d;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  user-select:none;
}

/* ================= GAME ================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#20232d 0%,#101218 48%,#07080b 100%);
}

/* ================= TOP BAR ================= */

#topbar{
  position:absolute;
  z-index:50;
  top:0;
  left:0;
  width:100%;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 22px;

  background:linear-gradient(
    180deg,
    rgba(5,6,10,.96),
    rgba(5,6,10,.72),
    transparent
  );

  pointer-events:none;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 14px #ff2f81;
}

.level{
  font-size:12px;
  color:#aaa;
  margin-top:3px;
  letter-spacing:1px;
}

.stats{
  display:flex;
  gap:10px;
  align-items:center;
}

.stat{
  width:120px;
}

.stat label{
  display:block;
  font-size:10px;
  color:#aaa;
  margin-bottom:4px;
}

.bar{
  width:100%;
  height:7px;
  background:#252731;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #3b3d47;
}

.fill{
  height:100%;
  width:100%;
  border-radius:20px;
}

.health{
  background:linear-gradient(90deg,#ff1744,#ff4f70);
}

.energy{
  background:linear-gradient(90deg,#00d9ff,#7b5cff);
}

/* ================= MAP ================= */

#map{
  position:absolute;
  width:1400px;
  height:900px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  background:
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    #15171d;

  background-size:40px 40px;

  box-shadow:
    0 0 100px rgba(0,0,0,.9),
    inset 0 0 100px rgba(0,0,0,.65);

  border:2px solid #30333c;
}

/* ================= ROOMS ================= */

.room{
  position:absolute;
  border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.025);
  box-shadow:
    inset 0 0 35px rgba(0,0,0,.45),
    0 0 25px rgba(0,0,0,.25);
}

.room h2{
  position:absolute;
  top:14px;
  left:16px;
  font-size:13px;
  letter-spacing:2px;
  color:#888;
  font-weight:900;
}

.party{
  left:40px;
  top:50px;
  width:570px;
  height:330px;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,0,130,.09),transparent 60%),
    rgba(255,255,255,.025);
}

.kitchen{
  left:650px;
  top:50px;
  width:310px;
  height:330px;
}

.bedroom{
  left:1000px;
  top:50px;
  width:350px;
  height:330px;
}

.bar{
  left:40px;
  top:430px;
  width:330px;
  height:390px;
}

.lounge{
  left:410px;
  top:430px;
  width:550px;
  height:390px;
}

.garden{
  left:1000px;
  top:430px;
  width:350px;
  height:390px;

  background:
    radial-gradient(circle at 20% 20%,rgba(0,255,170,.06),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(0,150,255,.05),transparent 30%),
    rgba(255,255,255,.025);
}

/* ================= FLOOR DETAILS ================= */

.floor-light{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,40,150,.15),
    transparent 70%
  );
}

.l1{left:180px;top:100px;}
.l2{left:390px;top:180px;}
.l3{left:730px;top:100px;}
.l4{left:1100px;top:150px;}

.sofa{
  position:absolute;
  width:150px;
  height:55px;
  border-radius:12px;
  background:#242832;
  border:2px solid #3b404c;
  box-shadow:0 10px 20px rgba(0,0,0,.35);
}

.sofa:before{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:8px;
  height:27px;
  background:#303542;
  border-radius:8px;
}

.s1{left:60px;top:220px;}
.s2{left:350px;top:100px;}
.s3{left:250px;top:280px;}

.table{
  position:absolute;
  width:110px;
  height:65px;
  border-radius:50%;
  background:#22252d;
  border:2px solid #3c404a;
}

.t1{left:250px;top:100px;}
.t2{left:720px;top:220px;}
.t3{left:1090px;top:220px;}

/* ================= BAR ================= */

.counter{
  position:absolute;
  left:25px;
  right:25px;
  bottom:55px;
  height:80px;
  background:#17191f;
  border:2px solid #3b3e48;
  border-radius:12px;
}

.bottle{
  position:absolute;
  bottom:18px;
  width:12px;
  height:38px;
  border-radius:4px 4px 3px 3px;
  background:#777;
}

.b1{left:45px;}
.b2{left:75px;height:45px;}
.b3{left:105px;height:32px;}
.b4{left:135px;height:42px;}

/* ================= GARDEN ================= */

.tree{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#173a32;
  border:2px solid #286052;
  box-shadow:0 0 20px rgba(0,255,170,.08);
}

.tree:after{
  content:"";
  position:absolute;
  width:14px;
  height:40px;
  background:#4a3326;
  left:28px;
  top:60px;
}

.tr1{left:45px;top:65px;}
.tr2{left:230px;top:80px;}
.tr3{left:110px;top:250px;}
.tr4{left:260px;top:270px;}

/* ================= OBJECTIVE ================= */

#objective{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid #ff2f81;
  box-shadow:
    0 0 10px #ff2f81,
    0 0 30px rgba(255,47,129,.55);

  transform:translate(-50%,-50%);
  z-index:15;
  animation:pulse 1.3s infinite;
}

#objective:after{
  content:"";
  position:absolute;
  inset:9px;
  border-radius:50%;
  background:#ff2f81;
}

@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.18)}
}

/* ================= PLAYER ================= */

#player{
  position:absolute;
  width:70px;
  height:110px;
  z-index:30;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 14px 10px rgba(0,0,0,.6));
}

.shadow{
  position:absolute;
  width:62px;
  height:16px;
  bottom:0;
  left:4px;
  background:rgba(0,0,0,.65);
  border-radius:50%;
  filter:blur(4px);
}

/* HEAD */

.head{
  position:absolute;
  width:40px;
  height:43px;
  left:15px;
  top:3px;
  background:linear-gradient(145deg,#c98763,#8c513d);
  border-radius:45% 45% 48% 48%;
  z-index:5;
  box-shadow:
    inset -7px -5px 9px rgba(70,20,10,.28),
    inset 5px 3px 7px rgba(255,220,190,.12);
}

/* HAIR */

.hair{
  position:absolute;
  width:45px;
  height:24px;
  left:12px;
  top:0;
  z-index:8;

  background:#101115;

  border-radius:
    55% 60% 35% 30% /
    75% 75% 30% 30%;

  transform:rotate(-3deg);

  box-shadow:
    inset 0 -5px 5px rgba(0,0,0,.5);
}

.hair:after{
  content:"";
  position:absolute;
  width:17px;
  height:12px;
  left:2px;
  bottom:-5px;
  background:#101115;
  transform:rotate(-15deg);
  border-radius:0 0 50% 50%;
}

/* GLASSES */

.glasses{
  position:absolute;
  z-index:12;
  left:11px;
  top:20px;
  width:48px;
  height:13px;
}

.glass{
  position:absolute;
  width:21px;
  height:11px;
  border-radius:4px;
  background:#090a0c;
  border:1px solid #777;
  box-shadow:0 0 4px rgba(255,255,255,.15);
}

.glass.left{left:0;}
.glass.right{right:0;}

.glasses:after{
  content:"";
  position:absolute;
  width:8px;
  height:2px;
  background:#111;
  left:20px;
  top:4px;
}

/* NECK */

.neck{
  position:absolute;
  width:14px;
  height:12px;
  left:28px;
  top:40px;
  background:#9d5d45;
  z-index:3;
}

/* BODY / HOODIE */

.body{
  position:absolute;
  width:53px;
  height:50px;
  left:9px;
  top:43px;
  z-index:4;

  background:linear-gradient(
    100deg,
    #090a0d,
    #1a1c22 50%,
    #08090c
  );

  border-radius:13px 13px 8px 8px;

  box-shadow:
    inset 0 0 8px rgba(255,255,255,.04);
}

/* WHITE SHIRT */

.shirt{
  position:absolute;
  width:20px;
  height:30px;
  left:25px;
  top:48px;
  z-index:6;

  background:#e6e7e9;

  clip-path:polygon(
    30% 0,
    70% 0,
    100% 100%,
    0 100%
  );
}

/* HOOD STRINGS */

.string{
  position:absolute;
  z-index:10;
  width:2px;
  height:19px;
  background:#c9c9c9;
  top:53px;
}

.string.left{
  left:27px;
  transform:rotate(3deg);
}

.string.right{
  left:36px;
  transform:rotate(-3deg);
}

/* ARMS */

.arm{
  position:absolute;
  width:14px;
  height:42px;
  top:48px;
  background:#111318;
  border-radius:9px;
  z-index:3;
}

.arm.left{
  left:1px;
  transform:rotate(8deg);
}

.arm.right{
  right:1px;
  transform:rotate(-8deg);
}

.hand{
  position:absolute;
  width:13px;
  height:13px;
  background:#9d5d45;
  border-radius:50%;
  top:82px;
  z-index:4;
}

.hand.left{left:0;}
.hand.right{right:0;}

/* PANTS */

.pants{
  position:absolute;
  left:16px;
  top:87px;
  width:39px;
  height:26px;
  z-index:2;
  background:#20242c;
  border-radius:5px;
}

.leg{
  position:absolute;
  width:17px;
  height:25px;
  top:101px;
  background:#171a20;
  border-radius:4px;
  z-index:1;
}

.leg.left{left:17px;}
.leg.right{left:38px;}

/* SHOES */

.shoe{
  position:absolute;
  width:24px;
  height:11px;
  background:#f0f1f2;
  border-radius:8px 8px 5px 5px;
  z-index:4;
  top:121px;
}

.shoe.left{left:11px;}
.shoe.right{left:35px;}

/* ================= NAME TAG ================= */

.nameTag{
  position:absolute;
  left:50%;
  top:-30px;
  transform:translateX(-50%);
  white-space:nowrap;

  padding:5px 10px;
  border-radius:7px;

  background:rgba(5,6,9,.8);
  border:1px solid rgba(255,47,129,.5);

  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;

  box-shadow:0 0 12px rgba(255,47,129,.18);
}

/* ================= WALK ================= */

.walking .leg.left{
  animation:leg1 .18s infinite alternate;
}

.walking .leg.right{
  animation:leg2 .18s infinite alternate;
}

.walking .arm.left{
  animation:arm1 .18s infinite alternate;
}

.walking .arm.right{
  animation:arm2 .18s infinite alternate;
}

@keyframes leg1{
  from{transform:rotate(8deg);}
  to{transform:rotate(-13deg);}
}

@keyframes leg2{
  from{transform:rotate(-8deg);}
  to{transform:rotate(13deg);}
}

@keyframes arm1{
  from{transform:rotate(8deg);}
  to{transform:rotate(-12deg);}
}

@keyframes arm2{
  from{transform:rotate(-8deg);}
  to{transform:rotate(12deg);}
}

/* ================= MOBILE CONTROLS ================= */

#mobileControls{
  position:absolute;
  z-index:100;
  left:20px;
  bottom:22px;
  width:170px;
  height:170px;
  display:none;
}

.control{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:15px;

  border:1px solid rgba(255,255,255,.18);
  background:rgba(20,22,29,.85);

  color:white;
  font-size:22px;

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
    0 7px 20px rgba(0,0,0,.4),
    inset 0 0 10px rgba(255,255,255,.03);
}

.control:active{
  transform:scale(.92);
  background:rgba(255,47,129,.25);
}

.up{
  left:59px;
  top:0;
}

.down{
  left:59px;
  bottom:0;
}

.left{
  left:0;
  top:59px;
}

.right{
  right:0;
  top:59px;
}

#action{
  position:absolute;
  z-index:100;
  right:25px;
  bottom:35px;

  width:78px;
  height:78px;

  border-radius:50%;

  border:2px solid rgba(255,47,129,.7);
  background:rgba(255,47,129,.15);

  color:white;
  font-weight:900;
  font-size:13px;

  box-shadow:
    0 0 25px rgba(255,47,129,.2),
    inset 0 0 20px rgba(255,47,129,.08);

  display:none;
}

/* ================= HINT ================= */

#hint{
  position:absolute;
  z-index:60;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);

  padding:8px 14px;

  background:rgba(5,6,9,.78);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;

  color:#aaa;
  font-size:11px;
  letter-spacing:.5px;

  pointer-events:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

  #topbar{
    height:65px;
    padding:8px 12px;
  }

  .logo{
    font-size:15px;
  }

  .level{
    font-size:9px;
  }

  .stat{
    width:75px;
  }

  .stat label{
    font-size:8px;
  }

  #map{
    width:1000px;
    height:700px;
  }

  #mobileControls,
  #action{
    display:block;
  }

  #hint{
    display:none;
  }
}

@media(min-width:801px){
  #hint{
    display:block;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- TOP UI -->
  <div id="topbar">

    <div>
      <div class="logo">PARTY NIGHT CHAOS</div>
      <div class="level">LEVEL 01 • ALEX</div>
    </div>

    <div class="stats">

      <div class="stat">
        <label>HEALTH</label>
        <div class="bar">
          <div class="fill health"></div>
        </div>
      </div>

      <div class="stat">
        <label>ENERGY</label>
        <div class="bar">
          <div class="fill energy"></div>
        </div>
      </div>

    </div>

  </div>


  <!-- MAP -->
  <div id="map">

    <!-- PARTY -->
    <div class="room party">
      <h2>PARTY HALL</h2>

      <div class="floor-light l1"></div>
      <div class="floor-light l2"></div>

      <div class="sofa s1"></div>
      <div class="sofa s2"></div>
      <div class="table t1"></div>
    </div>


    <!-- KITCHEN -->
    <div class="room kitchen">
      <h2>KITCHEN</h2>

      <div class="counter"
           style="top:70px;bottom:auto;"></div>

      <div class="table t2"></div>
    </div>


    <!-- BEDROOM -->
    <div class="room bedroom">
      <h2>BEDROOM</h2>

      <div class="sofa"
           style="left:50px;top:100px;width:240px;"></div>

      <div class="table t3"></div>
    </div>


    <!-- BAR -->
    <div class="room bar">
      <h2>BAR</h2>

      <div class="counter"></div>

      <div class="bottle b1"></div>
      <div class="bottle b2"></div>
      <div class="bottle b3"></div>
      <div class="bottle b4"></div>
    </div>


    <!-- LOUNGE -->
    <div class="room lounge">
      <h2>LOUNGE</h2>

      <div class="sofa s1"></div>
      <div class="sofa s2"></div>
      <div class="sofa s3"></div>
    </div>


    <!-- GARDEN -->
    <div class="room garden">
      <h2>GARDEN</h2>

      <div class="tree tr1"></div>
      <div class="tree tr2"></div>
      <div class="tree tr3"></div>
      <div class="tree tr4"></div>
    </div>


    <!-- OBJECTIVE -->
    <div id="objective"></div>


    <!-- PLAYER -->
    <div id="player">

      <div class="nameTag">ALEX • LV 01</div>

      <div class="shadow"></div>

      <div class="head"></div>
      <div class="hair"></div>

      <div class="glasses">
        <div class="glass left"></div>
        <div class="glass right"></div>
      </div>

      <div class="neck"></div>

      <div class="body"></div>

      <div class="shirt"></div>

      <div class="string left"></div>
      <div class="string right"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="hand left"></div>
      <div class="hand right"></div>

      <div class="pants"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="shoe left"></div>
      <div class="shoe right"></div>

    </div>

  </div>


  <!-- MOBILE CONTROLS -->

  <div id="mobileControls">

    <button class="control up" data-dir="up">▲</button>
    <button class="control down" data-dir="down">▼</button>
    <button class="control left" data-dir="left">◀</button>
    <button class="control right" data-dir="right">▶</button>

  </div>

  <button id="action">ACTION</button>

  <div id="hint">
    WASD / ARROW KEYS • MOVE ALEX • E = ACTION
  </div>

</div>


<script>

/* =========================================
   PLAYER MOVEMENT
========================================= */

const player = document.getElementById("player");
const objective = document.getElementById("objective");
const map = document.getElementById("map");

const keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

let x = 45;
let y = 55;

let speed = 0.55;


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener("keydown",(e)=>{

  const key = e.key.toLowerCase();

  if(key === "w" || key === "arrowup"){
    keys.up = true;
  }

  if(key === "s" || key === "arrowdown"){
    keys.down = true;
  }

  if(key === "a" || key === "arrowleft"){
    keys.left = true;
  }

  if(key === "d" || key === "arrowright"){
    keys.right = true;
  }

  if(key === "e"){
    action();
  }

});


window.addEventListener("keyup",(e)=>{

  const key = e.key.toLowerCase();

  if(key === "w" || key === "arrowup"){
    keys.up = false;
  }

  if(key === "s" || key === "arrowdown"){
    keys.down = false;
  }

  if(key === "a" || key === "arrowleft"){
    keys.left = false;
  }

  if(key === "d" || key === "arrowright"){
    keys.right = false;
  }

});


/* =========================================
   MOBILE BUTTONS
========================================= */

document.querySelectorAll(".control").forEach(button=>{

  const dir = button.dataset.dir;

  const start = (e)=>{
    e.preventDefault();
    keys[dir] = true;
  };

  const stop = (e)=>{
    e.preventDefault();
    keys[dir] = false;
  };

  button.addEventListener("touchstart",start,{passive:false});
  button.addEventListener("touchend",stop,{passive:false});
  button.addEventListener("touchcancel",stop,{passive:false});

  button.addEventListener("mousedown",start);
  button.addEventListener("mouseup",stop);
  button.addEventListener("mouseleave",stop);

});


/* =========================================
   ACTION
========================================= */

function action(){

  const button = document.getElementById("action");

  button.innerText = "✓";

  setTimeout(()=>{
    button.innerText = "ACTION";
  },600);

  console.log("ALEX ACTION");
}

document.getElementById("action")
  .addEventListener("click",action);


/* =========================================
   GAME LOOP
========================================= */

function update(){

  let moving = false;

  if(keys.up){
    y -= speed;
    moving = true;
  }

  if(keys.down){
    y += speed;
    moving = true;
  }

  if(keys.left){
    x -= speed;
    moving = true;
  }

  if(keys.right){
    x += speed;
    moving = true;
  }


  /* BOUNDARIES */

  x = Math.max(4,Math.min(96,x));
  y = Math.max(9,Math.min(91,y));


  /* PLAYER POSITION */

  player.style.left = x + "%";
  player.style.top = y + "%";


  /* WALK ANIMATION */

  if(moving){
    player.classList.add("walking");
  }else{
    player.classList.remove("walking");
  }


  /* CHARACTER DIRECTION */

  if(keys.left){
    player.style.transform =
      "translate(-50%,-50%) scaleX(-1)";
  }

  if(keys.right){
    player.style.transform =
      "translate(-50%,-50%) scaleX(1)";
  }


  /* OBJECTIVE */

  objective.style.left = "78%";
  objective.style.top = "48%";
