/* =========================================================
   PARTY NIGHT - MANSION MAYHEM
   FULL REPLACEMENT VERSION
========================================================= */

const WORLD_W = 3200;
const WORLD_H = 2100;

let game;

let player;
let npcs = [];

let cursors;
let keys;

let worldGraphics;
let decorGraphics;
let fxGraphics;

let objectiveText;
let scoreText;
let alertText;

let score = 0;
let attackCooldown = 0;

let joystick = {
    active:false,
    x:0,
    y:0
};

let actionPressed = false;


/* =========================================================
   CONFIG
========================================================= */

const config = {

    type:Phaser.AUTO,

    parent:"game-container",

    width:1280,
    height:720,

    backgroundColor:"#050713",

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH,
        width:1280,
        height:720
    },

    physics:{
        default:"arcade",

        arcade:{
            gravity:{
                y:0
            },

            debug:false
        }
    },

    scene:{
        preload,
        create,
        update
    }
};

game = new Phaser.Game(config);


/* =========================================================
   PRELOAD
========================================================= */

function preload(){
}


/* =========================================================
   CREATE
========================================================= */

function create(){

    worldGraphics = this.add.graphics();
    decorGraphics = this.add.graphics();
    fxGraphics = this.add.graphics();

    this.physics.world.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );

    createWorld(this);

    createRooms(this);

    createDecorations(this);

    createPlayer(this);

    createNPCs(this);

    createHUD(this);

    createControls(this);

    cursors =
        this.input.keyboard.createCursorKeys();

    keys =
        this.input.keyboard.addKeys({
            W:Phaser.Input.Keyboard.KeyCodes.W,
            A:Phaser.Input.Keyboard.KeyCodes.A,
            S:Phaser.Input.Keyboard.KeyCodes.S,
            D:Phaser.Input.Keyboard.KeyCodes.D,
            E:Phaser.Input.Keyboard.KeyCodes.E,
            SPACE:Phaser.Input.Keyboard.KeyCodes.SPACE
        });

    this.cameras.main.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );

    this.cameras.main.startFollow(
        player,
        true,
        0.10,
        0.10
    );

    this.cameras.main.setZoom(1);

    player.body.setCollideWorldBounds(true);
}


/* =========================================================
   UPDATE
========================================================= */

function update(scene){

    updatePlayer(scene);

    updateNPCs(scene);

    updateAttack(scene);

    updateObjective(scene);

    updateAlert(scene);
}


/* =========================================================

========================================================= */

            0xffd45c,

            x,

/* =========================================================
   ROOM DRAW
========================================================= */

function drawRoom(
    x,
    y,
    w,
    h,
    color,
    title
){

    worldGraphics.fillStyle(
        color
    );

    worldGraphics.fillRect(
        x,
        y,
        w,
        h
    );


    worldGraphics.lineStyle(
        9,
        0x596174
    );

    worldGraphics.strokeRect(
        x,
        y,
        w,
        h
    );


    worldGraphics.lineStyle(
        2,
        0x858da3
    );

    worldGraphics.strokeRect(
        x+14,
        y+14,
        w-28,
        h-28
    );


    const label =
        game.scene.scenes[0].add.text(
            x+w/2,
            y+34,
            title,
            {
                fontFamily:"Arial",
                fontSize:"24px",
                fontStyle:"bold",
                color:"#f3f6ff",
                backgroundColor:"#080d18",
                padding:{
                    left:14,
                    right:14,
                    top:7,
                    bottom:7
                }
            }
        );

    label
        .setOrigin(0.5)
        .setDepth(30);
}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(scene){

    if(!player || !player.body){
        return;
    }

    let dx = 0;
    let dy = 0;


    if(
        keys.W.isDown ||
        cursors.up.isDown
    ){
        dy -= 1;
    }

    if(
        keys.S.isDown ||
        cursors.down.isDown
    ){
        dy += 1;
    }

    if(
        keys.A.isDown ||
        cursors.left.isDown
    ){
        dx -= 1;
    }

    if(
        keys.D.isDown ||
        cursors.right.isDown
    ){
        dx += 1;
    }


    if(joystick.active){

        dx += joystick.x;
        dy += joystick.y;
    }


    if(
        dx !== 0 ||
        dy !== 0
    ){

        const len =
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        dx /= len;
        dy /= len;

        const speed = 270;

        player.body.setVelocity(
            dx*speed,
            dy*speed
        );

        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                dx*0.035,
                0.15
            );

    }else{

        player.body.setVelocity(
            0,
            0
        );

        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                0,
                0.15
            );
    }
}


/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPCs(scene){

    npcs.forEach(
        npc=>{

            if(
                !npc.active ||
                !npc.body
            ){
                return;
            }


            if(npc.stunned){

                npc.stunTimer -=
                    scene.game.loop.delta;

                npc.body.setVelocity(
                    0,
                    0
                );

                npc.rotation =
                    Math.sin(
                        scene.time.now/100
                    )*.15;

                if(
                    npc.stunTimer <= 0
                ){

                    npc.stunned =
                        false;

                    npc.rotation = 0;
                }

                return;
            }


            npc.timer -=
                scene.game.loop.delta;


            if(
                npc.timer <= 0
            ){

                npc.dirX =
                    Phaser.Math.FloatBetween(
                        -1,
                        1
                    );

                npc.dirY =
                    Phaser.Math.FloatBetween(
                        -1,
                        1
                    );

                npc.timer =
                    Phaser.Math.Between(
                        1200,
                        4000
                    );
            }


            const len =
                Math.sqrt(
                    npc.dirX*npc.dirX+
                    npc.dirY*npc.dirY
                ) || 1;


            npc.body.setVelocity(
                npc.dirX/len*npc.speed,
                npc.dirY/len*npc.speed
            );


            if(npc.x<150){

                npc.x=150;
                npc.dirX=1;
            }

            if(npc.x>3050){

                npc.x=3050;
                npc.dirX=-1;
            }

            if(npc.y<140){

                npc.y=140;
                npc.dirY=1;
            }

            if(npc.y>1980){

                npc.y=1980;
                npc.dirY=-1;
            }
        }
    );
}


/* =========================================================
   ATTACK SYSTEM
========================================================= */

function updateAttack(scene){

    if(
        attackCooldown > 0
    ){

        attackCooldown -=
            scene.game.loop.delta;
    }


    const keyboardAttack =
        Phaser.Input.Keyboard.JustDown(
            keys.SPACE
        ) ||
        Phaser.Input.Keyboard.JustDown(
            keys.E
        );


    if(
        keyboardAttack ||
        actionPressed
    ){

        if(
            attackCooldown <= 0
        ){

            performAttack(scene);

            actionPressed =
                false;
        }
    }
}


/* =========================================================
   PERFORM ATTACK
========================================================= */

function performAttack(scene){

    attackCooldown = 550;


    /* Attack ring */

    const ring =
        scene.add.circle(
            player.x,
            player.y,
            20,
            0xff278e,
            0.18
        );

    ring.setStrokeStyle(
        6,
        0xff278e,
        0.9
    );

    ring.setDepth(180);


    scene.tweens.add({

        targets:ring,

        radius:125,

        alpha:0,

        duration:280,

        ease:"Cubic.Out",

        onComplete:()=>{
            ring.destroy();
        }
    });


    let hit = false;


    npcs.forEach(
        npc=>{

            if(
                !npc.active ||
                npc.stunned
            ){
                return;
            }


            const distance =
                Phaser.Math.Distance.Between(
                    player.x,
                    player.y,
                    npc.x,
                    npc.y
                );


            if(
                distance <= 115
            ){

                npc.stunned =
                    true;

                npc.stunTimer =
                    1800;

                npc.body.setVelocity(
                    0,
                    0
                );

                score += 100;

                hit = true;


                /* Knockback */

                const angle =
                    Phaser.Math.Angle.Between(
                        player.x,
                        player.y,
                        npc.x,
                        npc.y
                    );

                npc.x +=
                    Math.cos(angle)*35;

                npc.y +=
                    Math.sin(angle)*35;


                /* HIT FX */

                const hitText =
                    scene.add.text(
                        npc.x,
                        npc.y-100,
                        "+100",
                        {
                            fontSize:"26px",
                            fontStyle:"bold",
                            color:"#ffdf4f",
                            stroke:"#090b13",
                            strokeThickness:5
                        }
                    )
                    .setOrigin(.5)
                    .setDepth(500);


                scene.tweens.add({

                    targets:hitText,

                    y:npc.y-150,

                    alpha:0,

                    duration:700,

                    onComplete:()=>{
                        hitText.destroy();
                    }
                });
            }
        }
    );


    if(hit){

        alertText.setText(
            "⚡ HIT! +100"
        );

    }else{

        alertText.setText(
            "ATTACK"
        );
    }
}

/* =========================================================
   JOYSTICK
========================================================= */

function updateJoystick(
    pointer,
    base,
    joy
){

    const bx = base.x;
    const by = base.y;

    let dx =
        pointer.x-bx;

    let dy =
        pointer.y-by;

    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    const max = 42;


    if(
        distance>max
    ){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;
    }


    joy.x =
        bx+dx;

    joy.y =
        by+dy;


    joystick.x =
        dx/max;

    joystick.y =
        dy/max;
}
