<body>

<script>

/* =========================================================
   PARTY NIGHT: CHAOS
   LEVEL 1 — THE MANSION PARTY
========================================================= */

const WORLD_W = 2400;
const WORLD_H = 1400;

let player;
let walls;
let npcs = [];

let objective;
let objectiveDone = false;

let score = 0;

let scoreText;
let missionText;

let joystickBase;
let joystickThumb;
let actionButton;

let joystickActive = false;
let joystickId = null;

let joyX = 0;
let joyY = 0;

let cursors;
let keys;

let sceneRef;


/* =========================================================
   CONFIG
========================================================= */

const config = {

    type: Phaser.AUTO,

    parent: "game",

    width: 1280,
    height: 720,

    backgroundColor: "#050608",

    physics:{
        default:"arcade",

        arcade:{
            gravity:{
                y:0
            },
            debug:false
        }
    },

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH,
        width:1280,
        height:720
    },

    scene:{
        create:create,
        update:update
    }
};

new Phaser.Game(config);


/* =========================================================
   CREATE
========================================================= */

function create(){

    const scene = this;

    sceneRef = scene;

    scene.physics.world.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );

    scene.cameras.main.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    /* WORLD BACKGROUND */

    scene.add.rectangle(
        WORLD_W / 2,
        WORLD_H / 2,
        WORLD_W,
        WORLD_H,
        0x080a0e
    );


    createFloor(scene);

    walls =
        scene.physics.add.staticGroup();


    createArchitecture(scene);

    createFurniture(scene);

    createPartyDetails(scene);


    /* PLAYER */

    player =
        createPlayer(
            scene,
            1180,
            760
        );


    scene.physics.add.collider(
        player,
        walls
    );


    /* NPCs */

    createNPC(scene,700,300,0xff3d8d);
    createNPC(scene,900,350,0x00d9ff);
    createNPC(scene,1100,300,0xffc107);
    createNPC(scene,1450,320,0x9d6cff);

    createNPC(scene,500,750,0xff4d8d);
    createNPC(scene,750,820,0xffc107);
    createNPC(scene,1550,760,0x00e5a0);

    createNPC(scene,1750,980,0xff4d8d);
    createNPC(scene,1950,1050,0xffc107);
    createNPC(scene,2150,850,0x9d6cff);

    createNPC(scene,500,1100,0x00d9ff);
    createNPC(scene,850,1120,0xff3d8d);


    /* NPC COLLISION */

    npcs.forEach(npc => {

        scene.physics.add.collider(
            npc,
            walls
        );

    });


    /* OBJECTIVE */

    objective =
        scene.add.circle(
            760,
            250,
            18,
            0xffd000
        );

    objective.setStrokeStyle(
        4,
        0xffffff,
        0.9
    );


    scene.tweens.add({

        targets:objective,

        scale:1.5,

        alpha:0.45,

        duration:650,

        yoyo:true,

        repeat:-1

    });


    /* CAMERA */

    scene.cameras.main.startFollow(
        player,
        true,
        0.08,
        0.08
    );


    /* KEYBOARD */

    cursors =
        scene.input.keyboard.createCursorKeys();

    keys =
        scene.input.keyboard.addKeys({
            W:Phaser.Input.Keyboard.KeyCodes.W,
            A:Phaser.Input.Keyboard.KeyCodes.A,
            S:Phaser.Input.Keyboard.KeyCodes.S,
            D:Phaser.Input.Keyboard.KeyCodes.D
        });


    createHUD(scene);

    createMobileControls(scene);

}


/* =========================================================
   UPDATE
========================================================= */

function update(time,delta){

    if(!player) return;

    let x = 0;
    let y = 0;


    /* KEYBOARD */

    if(
        cursors.left.isDown ||
        keys.A.isDown
    ){
        x -= 1;
    }

    if(
        cursors.right.isDown ||
        keys.D.isDown
    ){
        x += 1;
    }

    if(
        cursors.up.isDown ||
        keys.W.isDown
    ){
        y -= 1;
    }

    if(
        cursors.down.isDown ||
        keys.S.isDown
    ){
        y += 1;
    }


    /* MOBILE */

    if(joystickActive){

        x = joyX;
        y = joyY;

    }


    const movement =
        new Phaser.Math.Vector2(
            x,
            y
        );


    const speed = 240;


    if(movement.length() > 0){

        movement.normalize();

        player.body.setVelocity(
            movement.x * speed,
            movement.y * speed
        );

        player.walking = true;


        if(movement.x < -0.1){

            player.scaleX = -1;

        }

        else if(movement.x > 0.1){

            player.scaleX = 1;

        }

    }

    else{

        player.body.setVelocity(
            0,
            0
        );

        player.walking = false;

    }


    animatePlayer(
        player,
        time
    );


    /* OBJECTIVE */

    const distance =
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );


    if(
        distance < 55 &&
        !objectiveDone
    ){

        objectiveDone = true;

        score += 100;

        scoreText.setText(
            "SCORE  " + score
        );

        missionText.setText(
            "VIP FOUND  •  MISSION COMPLETE"
        );

        missionText.setColor(
            "#00ff9d"
        );

        objective.setFillStyle(
            0x00ff9d
        );

    }


    /* NPC MOVEMENT */

    npcs.forEach(npc => {

        npc.timer -= delta;


        if(npc.timer <= 0){

            npc.timer =
                Phaser.Math.Between(
                    1200,
                    3500
                );

            npc.targetX =
                Phaser.Math.Between(
                    180,
                    WORLD_W - 180
                );

            npc.targetY =
                Phaser.Math.Between(
                    180,
                    WORLD_H - 180
                );

        }


        const distance =
            Phaser.Math.Distance.Between(
                npc.x,
                npc.y,
                npc.targetX,
                npc.targetY
            );


        if(distance < 25){

            npc.body.setVelocity(
                0,
                0
            );

        }

        else{

            const angle =
                Phaser.Math.Angle.Between(
                    npc.x,
                    npc.y,
                    npc.targetX,
                    npc.targetY
                );


            npc.body.setVelocity(
                Math.cos(angle) * 35,
                Math.sin(angle) * 35
            );

        }

    });

}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(scene){

    /* MAIN FLOOR */

    scene.add.rectangle(
        1200,
        700,
        2250,
        1250,
        0x17191e
    );


    /* FLOOR GRID */

    const graphics =
        scene.add.graphics();


    graphics.lineStyle(
        1,
        0x292d35,
        0.45
    );


    for(
        let x = 80;
        x < WORLD_W;
        x += 80
    ){

        graphics.lineBetween(
            x,
            70,
            x,
            WORLD_H - 70
        );

    }


    for(
        let y = 70;
        y < WORLD_H;
        y += 80
    ){

        graphics.lineBetween(
            70,
            y,
            WORLD_W - 70,
            y
        );

    }


    /* OUTER BORDER */

    scene.add.rectangle(
        1200,
        700,
        2250,
        1250
    ).setStrokeStyle(
        8,
        0x313846
    );

}

/* =========================================================
   ROOM
========================================================= */

function createRoom(
    scene,
    x,
    y,
    w,
    h,
    color,
    label
){

    const room =
        scene.add.rectangle(
            x + w / 2,
            y + h / 2,
            w,
            h,
            color
        );


    room.setStrokeStyle(
        4,
        0x3b4353,
        0.9
    );


    scene.add.text(
        x + 25,
        y + 22,
        label,
        {
            fontFamily:"Arial",
            fontSize:"22px",
            fontStyle:"bold",
            color:"#ffffff",
            backgroundColor:"#07090dcc",
            padding:{
                left:12,
                right:12,
                top:8,
                bottom:8
            }
        }
    );

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    scene,
    x,
    y,
    w,
    h
){

    const wall =
        scene.add.rectangle(
            x,
            y,
            w,
            h,
            0x090b10
        );


    wall.setStrokeStyle(
        2,
        0x47516a
    );


    scene.physics.add.existing(
        wall,
        true
    );


    walls.add(
        wall
    );

}

/* =========================================================
   TABLE
========================================================= */

function createTable(scene,x,y){

    scene.add.circle(
        x,
        y,
        35,
        0x2b2520
    ).setStrokeStyle(
        3,
        0x715943
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const a =
            (Math.PI * 2 / 4) * i;

        scene.add.rectangle(
            x + Math.cos(a) * 55,
            y + Math.sin(a) * 55,
            25,
            25,
            0x302821
        );

    }

}

/* =========================================================
   PLAYER ANIMATION
========================================================= */

function animatePlayer(player,time){

    if(player.walking){

        player.walkCycle += 0.22;

        const swing =
            Math.sin(
                player.walkCycle
            );


        player.leftArm.rotation =
            swing * 0.2;

        player.rightArm.rotation =
            -swing * 0.2;

    }

    else{

        player.leftArm.rotation = 0;
        player.rightArm.rotation = 0;

    }


    if(player.glow){

        player.glow.alpha =
            0.05 +
            Math.sin(time * 0.004) * 0.025;

    }

}


/* =========================================================
   NPC
========================================================= */

function createNPC(
    scene,
    x,
    y,
    color
){

    const npc =
        scene.add.circle(
            x,
            y,
            15,
            color
        );


    npc.setStrokeStyle(
        3,
        0xffffff,
        0.7
    );


    scene.physics.add.existing(
        npc
    );


    npc.body.setCircle(
        15
    );


    npc.body.setCollideWorldBounds(
        true
    );


    npc.targetX = x;
    npc.targetY = y;

    npc.timer =
        Phaser.Math.Between(
            500,
            2500
        );


    npcs.push(npc);

}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

function createMobileControls(scene){

    joystickBase =
        scene.add.circle(
            105,
            605,
            65,
            0x111827,
            0.75
        );


    joystickBase.setScrollFactor(0);

    joystickBase.setStrokeStyle(
        3,
        0x00d9ff,
        0.7
    );


    joystickThumb =
        scene.add.circle(
            105,
            605,
            29,
            0x00d9ff,
            0.8
        );


    joystickThumb.setScrollFactor(0);


    joystickBase.setInteractive();


    joystickBase.on(
        "pointerdown",
        pointer => {

            joystickActive = true;

            joystickId =
                pointer.id;

            updateJoystick(
                pointer
            );

        }
    );


    scene.input.on(
        "pointermove",
        pointer => {

            if(
                joystickActive &&
                pointer.id === joystickId
            ){

                updateJoystick(
                    pointer
                );

            }

        }
    );


    scene.input.on(
        "pointerup",
        pointer => {

            if(
                pointer.id === joystickId
            ){

                joystickActive = false;

                joystickId = null;

                joyX = 0;
                joyY = 0;

                joystickThumb.x =
                    joystickBase.x;

                joystickThumb.y =
                    joystickBase.y;

            }

        }
    );


    /* ACTION */

    actionButton =
        scene.add.circle(
            1175,
            605,
            58,
            0xff238d,
            0.82
        );


    actionButton.setScrollFactor(0);


    actionButton.setStrokeStyle(
        3,
        0xffffff,
        0.75
    );


    actionButton.setInteractive();


    actionButton.on(
        "pointerdown",
        actionPressed
    );


    scene.add.text(
        1175,
        605,
        "ACTION",
        {
            fontFamily:"Arial",
            fontSize:"13px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    /* HIDE MOBILE UI ON DESKTOP */

    if(
        !/Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
    ){

        joystickBase.setVisible(false);
        joystickThumb.setVisible(false);
        actionButton.setVisible(false);

    }

}


/* =========================================================
   JOYSTICK
========================================================= */

function updateJoystick(pointer){

    const dx =
        pointer.x -
        joystickBase.x;

    const dy =
        pointer.y -
        joystickBase.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const max = 45;


    let px = dx;
    let py = dy;


    if(distance > max){

        px =
            dx / distance * max;

        py =
            dy / distance * max;

    }


    joystickThumb.x =
        joystickBase.x + px;

    joystickThumb.y =
        joystickBase.y + py;


    joyX =
        px / max;

    joyY =
        py / max;

}


/* =========================================================
   ACTION
========================================================= */

function actionPressed(){

    if(!player || !objective)
        return;


    const distance =
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );


    if(
        distance < 100 &&
        !objectiveDone
    ){

        objectiveDone = true;

        score += 100;

        scoreText.setText(
            "SCORE  " + score
        );

        missionText.setText(
            "MISSION COMPLETE  •  VIP FOUND"
        );

        missionText.setColor(
            "#00ff9d"
        );

        objective.setFillStyle(
            0x00ff9d
        );

    }

}
