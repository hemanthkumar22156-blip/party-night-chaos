========================================================= */

function create(){

    roomGraphics = this.add.graphics();

    createWorld(this);

    createRooms(this);

    createWalls(this);

    createDecorations(this);

    createPlayer(this);

    createNPCs(this);

    createHUD(this);

    createControls(this);

    cursors = this.input.keyboard.createCursorKeys();

    keys = this.input.keyboard.addKeys({

        W:Phaser.Input.Keyboard.KeyCodes.W,

        A:Phaser.Input.Keyboard.KeyCodes.A,

        S:Phaser.Input.Keyboard.KeyCodes.S,

        D:Phaser.Input.Keyboard.KeyCodes.D,

        SPACE:Phaser.Input.Keyboard.KeyCodes.SPACE,

        E:Phaser.Input.Keyboard.KeyCodes.E

    });


    this.physics.world.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    this.cameras.main.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    this.cameras.main.startFollow(
        player,
        true,
        0.08,
        0.08
    );


    this.cameras.main.setZoom(1);


    this.physics.add.collider(
        player,
        walls
    );


    npcs.forEach(function(npc){

        this.physics.add.collider(
            npc,
            walls
        );

    },this);


    updateScoreText(this);

}


/* =========================================================
   UPDATE
========================================================= */

function update(time,delta){

    updatePlayer(this);

    updateNPCs(this,delta);

    updateAttackFX(this,delta);

    updateObjective(this);

}


/* =========================================================
   PIXEL TEXTURE
========================================================= */

function createPixelTexture(scene){

    if(scene.textures.exists("pixel")){
        return;
    }

    const g = scene.make.graphics({
        x:0,
        y:0,
        add:false
    });

    g.fillStyle(0xffffff);

    g.fillRect(
        0,
        0,
        4,
        4
    );

    g.generateTexture(
        "pixel",
        4,
        4
    );

    g.destroy();
}

        0x72798b

/* =========================================================
   ADD WALL
========================================================= */

function addWall(
    scene,
    x,
    y,
    w,
    h
){

    const wall = walls.create(
        x,
        y,
        "pixel"
    );

    wall.setDisplaySize(
        w,
        h
    );

    wall.refreshBody();

    wall.setVisible(false);

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(scene){

    let dx = 0;

    let dy = 0;


    if(
        keys.W.isDown ||
        cursors.up.isDown
    ){
        dy -= 1;
    }


    if(
        keys.S.isDown ||
        cursors.down.isDown
    ){
        dy += 1;
    }


    if(
        keys.A.isDown ||
        cursors.left.isDown
    ){
        dx -= 1;
    }


    if(
        keys.D.isDown ||
        cursors.right.isDown
    ){
        dx += 1;
    }


    if(
        joystick.active
    ){

        dx += joystick.x;

        dy += joystick.y;

    }


    if(
        dx !== 0 ||
        dy !== 0
    ){

        const len =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        dx /= len;

        dy /= len;


        const speed = 255;


        player.body.setVelocity(
            dx*speed,
            dy*speed
        );


        playerMoving = true;


        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                dx*0.045,
                0.15
            );


        animatePlayer(
            scene
        );

    }
    else{

        player.body.setVelocity(
            0,
            0
        );


        playerMoving = false;


        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                0,
                0.15
            );

    }


    /* ACTION */

    if(
        Phaser.Input.Keyboard.JustDown(
            keys.SPACE
        ) ||
        Phaser.Input.Keyboard.JustDown(
            keys.E
        )
    ){

        performAttack(
            scene
        );

    }


    if(actionPressed){

        actionPressed = false;

        performAttack(
            scene
        );

    }


    attackCooldown -=
        scene.game.loop.delta;


    if(attackCooldown < 0){

        attackCooldown = 0;

    }

}


/* =========================================================
   PLAYER WALK ANIMATION
========================================================= */

function animatePlayer(scene){

    if(!playerMoving){
        return;
    }

    const wobble =
        Math.sin(
            scene.time.now / 90
        ) * 0.035;

    player.scaleX =
        1 + wobble;

    player.scaleY =
        1 - wobble;

}


/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPCs(
    scene,
    delta
){

    npcs.forEach(
        function(npc){

            if(npc.stunned > 0){

                npc.stunned -= delta;

                npc.body.setVelocity(
                    0,
                    0
                );

                npc.rotation =
                    Phaser.Math.Linear(
                        npc.rotation,
                        0,
                        0.12
                    );

                return;
            }


            npc.timer -= delta;


            if(
                npc.timer <= 0
            ){

                npc.dirX =
                    Phaser.Math.FloatBetween(
                        -1,
                        1
                    );

                npc.dirY =
                    Phaser.Math.FloatBetween(
                        -1,
                        1
                    );


                npc.timer =
                    Phaser.Math.Between(
                        1200,
                        4200
                    );

            }


            const len =
                Math.sqrt(
                    npc.dirX*npc.dirX +
                    npc.dirY*npc.dirY
                ) || 1;


            npc.body.setVelocity(
                npc.dirX/len*npc.speed,
                npc.dirY/len*npc.speed
            );


            npc.rotation =
                Phaser.Math.Linear(
                    npc.rotation,
                    npc.dirX*0.04,
                    0.08
                );


            /* WORLD LIMIT */

            if(npc.x < 180){

                npc.x = 180;

                npc.dirX = 1;

            }


            if(npc.x > 2700){

                npc.x = 2700;

                npc.dirX = -1;

            }


            if(npc.y < 170){

                npc.y = 170;

                npc.dirY = 1;

            }


            if(npc.y > 1720){

                npc.y = 1720;

                npc.dirY = -1;

            }

        }
    );

}


/* =========================================================
   NPC SEPARATION
========================================================= */

function updateNPCSeparation(scene){

    for(
        let i=0;
        i<npcs.length;
        i++
    ){

        for(
            let j=i+1;
            j<npcs.length;
            j++
        ){

            const a = npcs[i];

            const b = npcs[j];


            const distance =
                Phaser.Math.Distance.Between(
                    a.x,
                    a.y,
                    b.x,
                    b.y
                );


            if(
                distance < 45 &&
                distance > 0
            ){

                const angle =
                    Phaser.Math.Angle.Between(
                        b.x,
                        b.y,
                        a.x,
                        a.y
                    );


                a.x +=
                    Math.cos(angle)*0.8;

                a.y +=
                    Math.sin(angle)*0.8;

            }

        }

    }

}


/* =========================================================
   ATTACK / SHOCKWAVE
========================================================= */

function performAttack(scene){

    if(
        attackCooldown > 0
    ){

        return;

    }


    attackCooldown = 550;


    chaosCount++;


    /* VISUAL */

    player.attackRing.setRadius(
        20
    );

    player.attackRing.setStrokeStyle(
        5,
        0x00eaff,
        1
    );


    attackFlash = 260;


    const hitRadius = 105;


    npcs.forEach(
        function(npc){

            const distance =
                Phaser.Math.Distance.Between(
                    player.x,
                    player.y,
                    npc.x,
                    npc.y
                );


            if(
                distance <= hitRadius
            ){

                const angle =
                    Phaser.Math.Angle.Between(
                        player.x,
                        player.y,
                        npc.x,
                        npc.y
                    );


                npc.body.setVelocity(
                    Math.cos(angle)*280,
                    Math.sin(angle)*280
                );


                npc.stunned = 800;


                npc.label.setText(
                    "WHOA!"
                );


                score += 100;


                showFloatingText(
                    scene,
                    npc.x,
                    npc.y-100,
                    "+100"
                );

            }

        }
    );


    score += 10;


    updateScoreText(
        scene
    );


    statusText.setText(
        "⚡ SHOCKWAVE!"
    );


    scene.time.delayedCall(
        500,
        function(){

            if(statusText){

                statusText.setText(
                    "PARTY IS GETTING WILD"
                );

            }

        }
    );

}


/* =========================================================
   ATTACK FX
========================================================= */

function updateAttackFX(
    scene,
    delta
){

    if(
        attackFlash <= 0
    ){

        return;

    }


    attackFlash -= delta;


    let radius =
        20 +
        (260-attackFlash)*0.35;


    player.attackRing.setRadius(
        radius
    );


    player.attackRing.setStrokeStyle(
        5,
        0x00eaff,
        Math.max(
            0,
            attackFlash/260
        )
    );


    if(
        attackFlash <= 0
    ){

        player.attackRing.setStrokeStyle(
            5,
            0x00eaff,
            0
        );

    }

}

    actionButton.setStrokeStyle(
        4,
        0xff65c0,
        0.95
    );


    scene.add.text(
        1170,
        615,
        "ACTION",
        {
            fontFamily:"Arial",
            fontSize:"17px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0)
    .setDepth(1001);


    scene.add.text(
        105,
        685,
        "MOVE",
        {
            fontFamily:"Arial",
            fontSize:"13px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0)
    .setDepth(1001);


    /* POINTER DOWN */

    scene.input.on(
        "pointerdown",
        function(pointer){

            if(
                pointer.x < 230 &&
                pointer.y > 520
            ){

                joystick.active = true;

                updateJoystick(
                    pointer,
                    joyBase,
                    joy
                );

            }


            if(
                pointer.x > 1080 &&
                pointer.y > 520
            ){

                actionPressed = true;

            }

        }
    );


    /* POINTER MOVE */

    scene.input.on(
        "pointermove",
        function(pointer){

            if(
                joystick.active
            ){

                updateJoystick(
                    pointer,
                    joyBase,
                    joy
                );

            }

        }
    );


    /* POINTER UP */

    scene.input.on(
        "pointerup",
        function(){

            joystick.active = false;

            joystick.x = 0;

            joystick.y = 0;

            joy.x = 105;

            joy.y = 615;

        }
    );

}


/* =========================================================
   JOYSTICK UPDATE
========================================================= */

function updateJoystick(
    pointer,
    base,
    joy
){

    const bx = base.x;

    const by = base.y;


    let dx =
        pointer.x-bx;

    let dy =
        pointer.y-by;


    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    const max = 42;


    if(
        distance > max
    ){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;

    }


    joy.x =
        bx+dx;

    joy.y =
        by+dy;


    joystick.x =
        dx/max;

    joystick.y =
        dy/max;

}
