/* =========================================================
   CHARACTER WALK
========================================================= */

function animateCharacter(c,moving,time){

    if(!c||!c.parts)return;

    const p=c.parts;

    if(moving){

        const swing=
            Math.sin(time*.015)*.35;

        p.leftArm.rotation=swing;
        p.rightArm.rotation=-swing;

        p.leftLeg.rotation=
            -swing*.75;

        p.rightLeg.rotation=
            swing*.75;

    }else{

        p.leftArm.rotation=0;
        p.rightArm.rotation=0;

        p.leftLeg.rotation=0;
        p.rightLeg.rotation=0;
    }
}

/* =========================================================
   ROOM
========================================================= */

function room(scene,x,y,w,h,title){

    scene.add.rectangle(
        x,
        y,
        w,
        h,
        0x343a44
    )
    .setStrokeStyle(
        7,
        0x565f6d
    );


    /* floor pattern */

    for(
        let xx=x-w/2+35;
        xx<x+w/2;
        xx+=70
    ){

        for(
            let yy=y-h/2+35;
            yy<y+h/2;
            yy+=70
        ){

            scene.add.rectangle(
                xx,
                yy,
                65,
                65,
                ((xx+yy)%140===0)
                    ?0x303640
                    :0x383e48
            );
        }
    }


    /* title */

    scene.add.rectangle(
        x,
        y-h/2+22,
        w,
        42,
        0x080b10,
        .75
    );

    scene.add.text(
        x,
        y-h/2+22,
        title,
        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#ffffff",
            fontStyle:"bold"
        }
    )
    .setOrigin(.5);
}

    )
    .setStrokeStyle(

        for(let y=360;y<=580;y+=50){

    scene.add.rectangle(

        "DJ",
        {
            fontSize:"24px",
            color:"#00eaff",
            fontStyle:"bold"

    )
    .setOrigin(.5);


    /* speakers */

    for(let i=-1;i<=1;i++){

        scene.add.circle(

    partyTable(scene,310,700);

    for(let i=0;i<6;i++){

function partyTable(scene,x,y){

    scene.add.circle(
        x,
        y,
        45,
        0x6b432d
    )
    .setStrokeStyle(
        3,
        0x352319
    );

    for(let i=0;i<4;i++){

        const a=i*Math.PI/2;

        scene.add.rectangle(
            x+Math.cos(a)*55,
            y+Math.sin(a)*55,
            25,
            25,
            0x4c525a
        );
    }
}

/* =========================================================
   NPC AI
========================================================= */

function setupNPC(npc){

    npc.targetX=
        150+
        Math.random()*
        (WORLD_W-300);

    npc.targetY=
        150+
        Math.random()*
        (WORLD_H-300);
}


function updateNPC(npc,delta,time){

    const dx=npc.targetX-npc.x;
    const dy=npc.targetY-npc.y;

    const dist=Math.sqrt(
        dx*dx+dy*dy
    );

    if(dist<25){

        npc.targetX=
            150+
            Math.random()*
            (WORLD_W-300);

        npc.targetY=
            150+
            Math.random()*
            (WORLD_H-300);

        animateCharacter(
            npc,
            false,
            time
        );

        return;
    }


    const vx=dx/dist;
    const vy=dy/dist;

    npc.x+=
        vx*npc.speed*delta/1000;

    npc.y+=
        vy*npc.speed*delta/1000;


    if(vx<-.1){

        npc.scaleX=-1;

    }else if(vx>.1){

        npc.scaleX=1;
    }


    animateCharacter(
        npc,
        true,
        time
    );
}


/* =========================================================
   GAME SCENE
========================================================= */

class MainScene extends Phaser.Scene{

    constructor(){

        super("MainScene");
    }


    create(){

        createMap(this);


        /* MAIN CHARACTER */

        player=createMainCharacter(
            this,
            1200,
            800
        );


        /* NPCs */

        const positions=[

            [350,400],
            [500,650],
            [700,420],

            [1050,500],
            [1250,450],
            [1450,500],

            [1800,450],
            [2050,600],

            [350,1100],
            [650,1250],

            [1000,1200],
            [1750,1200]

        ];


        positions.forEach((p,i)=>{

            const npc=createNPC(
                this,
                p[0],
                p[1],
                i
            );

            setupNPC(npc);

            npcs.push(npc);
        });


        /* CAMERA */

        this.cameras.main.startFollow(
            player,
            true,
            .08,
            .08
        );


        this.cameras.main.setBounds(
            0,
            0,
            WORLD_W,
            WORLD_H
        );


        /* KEYBOARD */

        cursors=
            this.input.keyboard
            .createCursorKeys();

        keys=
            this.input.keyboard
            .addKeys("W,A,S,D");


        /* OBJECTIVE */

        this.add.circle(
            1200,
            150,
            22,
            0x00ffff,
            .8
        )
        .setDepth(5);


        this.add.text(
            1200,
            115,
            "OBJECTIVE",
            {
                fontSize:"15px",
                color:"#00ffff",
                fontStyle:"bold"
            }
        )
        .setOrigin(.5);


        /* HUD */

        this.add.rectangle(
            150,
            55,
            270,
            82,
            0x05070b,
            .82
        )
        .setScrollFactor(0)
        .setDepth(100);


        this.add.text(
            30,
            25,
            "PARTY NIGHT",
            {
                fontSize:"25px",
                color:"#00eaff",
                fontStyle:"bold"
            }
        )
        .setScrollFactor(0)
        .setDepth(101);


        this.add.text(
            30,
            60,
            "Explore the mansion",
            {
                fontSize:"15px",
                color:"#ffffff"
            }
        )
        .setScrollFactor(0)
        .setDepth(101);
    }


    update(time,delta){

        if(!player)return;


        let vx=0;
        let vy=0;


        if(
            cursors.left.isDown ||
            keys.A.isDown
        ){
            vx-=1;
        }


        if(
            cursors.right.isDown ||
            keys.D.isDown
        ){
            vx+=1;
        }


        if(
            cursors.up.isDown ||
            keys.W.isDown
        ){
            vy-=1;
        }


        if(
            cursors.down.isDown ||
            keys.S.isDown
        ){
            vy+=1;
        }


        if(joystick.active){

            vx+=joystick.x;
            vy+=joystick.y;
        }


        const moving=
            Math.abs(vx)>.05 ||
            Math.abs(vy)>.05;


        if(moving){

            const len=Math.sqrt(
                vx*vx+vy*vy
            );

            vx/=len;
            vy/=len;


            const speed=210;


            player.x+=
                vx*speed*delta/1000;

            player.y+=
                vy*speed*delta/1000;


            player.x=
                Phaser.Math.Clamp(
                    player.x,
                    70,
                    WORLD_W-70
                );


            player.y=
                Phaser.Math.Clamp(
                    player.y,
                    70,
                    WORLD_H-70
                );


            if(vx<-.1){

                player.scaleX=-1;

            }else if(vx>.1){

                player.scaleX=1;
            }
        }


        animateCharacter(
            player,
            moving,
            time
        );


        npcs.forEach(npc=>{

            updateNPC(
                npc,
                delta,
                time
            );
        });
    }
}


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joy=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


function joystickMove(e){

    const rect=
        joy.getBoundingClientRect();

    const touch=e.touches[0];

    let x=
        touch.clientX-
        (rect.left+rect.width/2);

    let y=
        touch.clientY-
        (rect.top+rect.height/2);


    const max=42;

    const dist=Math.sqrt(
        x*x+y*y
    );


    if(dist>max){

        x=x/dist*max;
        y=y/dist*max;
    }


    stick.style.left=
        (31+x)+"px";

    stick.style.top=
        (31+y)+"px";


    joystick.x=x/max;
    joystick.y=y/max;
    joystick.active=true;
}


joy.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        joystickMove(e);

    },
    {passive:false}
);


joy.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        joystickMove(e);

    },
    {passive:false}
);


function joystickReset(){

    stick.style.left="31px";
    stick.style.top="31px";

    joystick.x=0;
    joystick.y=0;

    joystick.active=false;
}


joy.addEventListener(
    "touchend",
    joystickReset
);

joy.addEventListener(
    "touchcancel",
    joystickReset
);
