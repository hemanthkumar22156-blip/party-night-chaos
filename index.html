<div id="game-container"></div>

<script>

/* =========================================================
   PARTY NIGHT - FINAL VERSION
   ========================================================= */

const WORLD_W = 3000;
const WORLD_H = 1900;

const config = {
    type: Phaser.AUTO,

    parent: "game-container",

    width: 1280,
    height: 720,

    backgroundColor: "#070914",

    scale:{
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width:1280,
        height:720
    },

    physics:{
        default:"arcade",
        arcade:{
            gravity:{y:0},
            debug:false
        }
    },

    scene:{
        preload,
        create,
        update
    }
};

const game = new Phaser.Game(config);


/* =========================================================
   GLOBALS
   ========================================================= */

let player;
let npcs = [];
let cursors;
let keys;

let joystick = {
    active:false,
    x:0,
    y:0
};

let actionPressed = false;

let roomGraphics;
let decorationGraphics;

let hudText;
let objectiveText;


/* =========================================================
   PRELOAD
   ========================================================= */

function preload(){}


/* =========================================================
   CREATE
   ========================================================= */

function create(){

    roomGraphics = this.add.graphics();
    decorationGraphics = this.add.graphics();

    createWorld(this);
    createRooms(this);
    createDecorations(this);

    createPlayer(this);
    createNPCs(this);

    createControls(this);
    createHUD(this);

    cursors = this.input.keyboard.createCursorKeys();

    keys = this.input.keyboard.addKeys({
        W:Phaser.Input.Keyboard.KeyCodes.W,
        A:Phaser.Input.Keyboard.KeyCodes.A,
        S:Phaser.Input.Keyboard.KeyCodes.S,
        D:Phaser.Input.Keyboard.KeyCodes.D
    });

    this.cameras.main.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );

    this.cameras.main.startFollow(
        player,
        true,
        0.08,
        0.08
    );

    this.cameras.main.setZoom(1);

    /* WORLD COLLISION BOUNDARIES */

    player.setCollideWorldBounds(true);

    this.physics.world.setBounds(
        0,
        0,
        WORLD_W,
        WORLD_H
    );
}


/* =========================================================
   UPDATE
   ========================================================= */

function update(){

    updatePlayer(this);
    updateNPCs(this);

    updateObjective(this);
}


/* =========================================================
   WORLD
   ========================================================= */

/* =========================================================
   ROOM DRAWING
   ========================================================= */

function drawRoom(
    x,
    y,
    w,
    h,
    color,
    title
){

    roomGraphics.fillStyle(color);
    roomGraphics.fillRect(
        x,
        y,
        w,
        h
    );

    roomGraphics.lineStyle(
        8,
        0x555b70
    );

    roomGraphics.strokeRect(
        x,
        y,
        w,
        h
    );

    roomGraphics.lineStyle(
        2,
        0x73798b
    );

    roomGraphics.strokeRect(
        x+12,
        y+12,
        w-24,
        h-24
    );

    /* TITLE */

    const txt = game.scene.scenes[0].add.text(
        x + w/2,
        y + 35,
        title,
        {
            fontFamily:"Arial",
            fontSize:"22px",
            fontStyle:"bold",
            color:"#dfe8ff",
            backgroundColor:"#101522",
            padding:{
                left:12,
                right:12,
                top:7,
                bottom:7
            }
        }
    );

    txt.setOrigin(0.5);
    txt.setDepth(20);
}


function drawOutdoor(
    x,
    y,
    w,
    h,
    color,
    title
){

    roomGraphics.fillStyle(color);

    roomGraphics.fillRect(
        x,
        y,
        w,
        h
    );

    roomGraphics.lineStyle(
        8,
        0x41664e
    );

    roomGraphics.strokeRect(
        x,
        y,
        w,
        h
    );

    const txt = game.scene.scenes[0].add.text(
        x+w/2,
        y+35,
        title,
        {
            fontFamily:"Arial",
            fontSize:"22px",
            fontStyle:"bold",
            color:"#ecfff3",
            backgroundColor:"#0b2018",
            padding:{
                left:12,
                right:12,
                top:7,
                bottom:7
            }
        }
    );

    txt.setOrigin(0.5);
    txt.setDepth(20);
}

/* =========================================================

function drawTable(x,y){

        42

    decorationGraphics.fillStyle(0xffc866);

}


function drawSofa(x,y,w,h){

    decorationGraphics.fillStyle(0x5b326c);

    decorationGraphics.fillRoundedRect(
        x,
        y,
        w,
        h,
        20
    );

    decorationGraphics.fillStyle(0x8a4c96);

    decorationGraphics.fillRoundedRect(
        x+15,
        y+12,
        w-30,
        h-30,
        15
    );
}


function drawTree(scene,x,y){

    decorationGraphics.fillStyle(0x62432d);

    decorationGraphics.fillRect(
        x-10,
        y,
        20,
        70
    );

    decorationGraphics.fillStyle(0x165b35);

    decorationGraphics.fillCircle(
        x,
        y,
        65
    );

    decorationGraphics.fillStyle(0x23834a);

    decorationGraphics.fillCircle(
        x-25,
        y-20,
        35
    );

    decorationGraphics.fillCircle(
        x+25,
        y-15,
        35
    );
}


function drawLight(scene,x,y){

    decorationGraphics.fillStyle(0xffd66b);

    decorationGraphics.fillCircle(
        x,
        y,
        10
    );

    decorationGraphics.fillStyle(0xffeea8);

    decorationGraphics.fillCircle(
        x,
        y,
        4
    );
}


function drawCircle(scene,x,y,r,color){

    decorationGraphics.fillStyle(color);

    decorationGraphics.fillCircle(
        x,
        y,
        r
    );
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(scene){

    let dx = 0;
    let dy = 0;

    if(
        keys.W.isDown ||
        cursors.up.isDown
    ){
        dy -= 1;
    }

    if(
        keys.S.isDown ||
        cursors.down.isDown
    ){
        dy += 1;
    }

    if(
        keys.A.isDown ||
        cursors.left.isDown
    ){
        dx -= 1;
    }

    if(
        keys.D.isDown ||
        cursors.right.isDown
    ){
        dx += 1;
    }


    /* MOBILE JOYSTICK */

    if(joystick.active){

        dx += joystick.x;
        dy += joystick.y;
    }


    if(dx !== 0 || dy !== 0){

        const length =
            Math.sqrt(dx*dx + dy*dy);

        dx /= length;
        dy /= length;

        const speed = 260;

        player.body.setVelocity(
            dx * speed,
            dy * speed
        );

        /* SIMPLE WALK ANIMATION */

        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                dx * .04,
                .15
            );

    }else{

        player.body.setVelocity(
            0,
            0
        );

        player.rotation =
            Phaser.Math.Linear(
                player.rotation,
                0,
                .15
            );
    }
}


/* =========================================================
   NPC MOVEMENT
   ========================================================= */

function updateNPCs(scene){

    npcs.forEach(npc=>{

        npc.timer -=
            scene.game.loop.delta;

        if(npc.timer <= 0){

            npc.dirX =
                Phaser.Math.FloatBetween(
                    -1,
                    1
                );

            npc.dirY =
                Phaser.Math.FloatBetween(
                    -1,
                    1
                );

            npc.timer =
                Phaser.Math.Between(
                    1200,
                    4000
                );
        }


        const length =
            Math.sqrt(
                npc.dirX*npc.dirX +
                npc.dirY*npc.dirY
            ) || 1;

        npc.body.setVelocity(
            npc.dirX/length*npc.speed,
            npc.dirY/length*npc.speed
        );


        /* KEEP NPC INSIDE WORLD */

        if(npc.x < 160){
            npc.x = 160;
            npc.dirX = 1;
        }

        if(npc.x > 2700){
            npc.x = 2700;
            npc.dirX = -1;
        }

        if(npc.y < 150){
            npc.y = 150;
            npc.dirY = 1;
        }

        if(npc.y > 1740){
            npc.y = 1740;
            npc.dirY = -1;
        }
    });
}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function createControls(scene){

    /* JOYSTICK */

    const joyBase =
        scene.add.circle(
            105,
            625,
            62,
            0x071526,
            .85
        )
        .setScrollFactor(0)
        .setDepth(1000);

    joyBase.setStrokeStyle(
        4,
        0x00d9ff,
        .8
    );


    const joy =
        scene.add.circle(
            105,
            625,
            30,
            0x00d9ff,
            .75
        )
        .setScrollFactor(0)
        .setDepth(1001);


    scene.input.on(
        "pointerdown",
        pointer=>{

            if(
                pointer.x < 220 &&
                pointer.y > 520
            ){

                joystick.active = true;

                updateJoystick(
                    pointer,
                    joyBase,
                    joy
                );
            }

            if(
                pointer.x > 1080 &&
                pointer.y > 550
            ){

                actionPressed = true;

                setTimeout(
                    ()=>{
                        actionPressed = false;
                    },
                    150
                );
            }
        }
    );


    scene.input.on(
        "pointermove",
        pointer=>{

            if(joystick.active){

                updateJoystick(
                    pointer,
                    joyBase,
                    joy
                );
            }
        }
    );


    scene.input.on(
        "pointerup",
        ()=>{
            joystick.active = false;

            joystick.x = 0;
            joystick.y = 0;

            joy.x = 105;
            joy.y = 625;
        }
    );


    /* ACTION BUTTON */

    const action =
        scene.add.circle(
            1170,
            625,
            65,
            0xe90078,
            .85
        )
        .setScrollFactor(0)
        .setDepth(1000);

    action.setStrokeStyle(
        4,
        0xff65c0,
        .9
    );


    scene.add.text(
        1170,
        625,
        "ACTION",
        {
            fontFamily:"Arial",
            fontSize:"18px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(.5)
    .setScrollFactor(0)
    .setDepth(1001);


    /* MOBILE LABEL */

    scene.add.text(
        105,
        690,
        "MOVE",
        {
            fontFamily:"Arial",
            fontSize:"14px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(.5)
    .setScrollFactor(0)
    .setDepth(1001);
}


function updateJoystick(pointer,base,joy){

    const bx = base.x;
    const by = base.y;

    let dx =
        pointer.x - bx;

    let dy =
        pointer.y - by;

    const dist =
        Math.sqrt(dx*dx + dy*dy);

    const max =
        42;

    if(dist > max){

        dx =
            dx / dist * max;

        dy =
            dy / dist * max;
    }

    joy.x = bx + dx;
    joy.y = by + dy;

    joystick.x =
        dx / max;

    joystick.y =
        dy / max;
}
