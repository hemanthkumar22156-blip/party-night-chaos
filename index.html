<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Party Night Chaos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020409;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    user-select:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#020409;
}

/* =====================================================
   MAP
===================================================== */

#map{
    position:absolute;
    left:50%;
    top:50%;

    width:100vw;
    height:100vh;

    transform:translate(-50%,-50%);

    background-image:
        linear-gradient(
            rgba(0,0,0,.08),
            rgba(0,0,0,.08)
        ),
        url("party-map.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    overflow:hidden;
}

/* =====================================================
   DARK VIGNETTE
===================================================== */

#vignette{
    position:absolute;
    inset:0;
    z-index:5;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.12) 70%,
            rgba(0,0,0,.55) 100%
        );
}

/* =====================================================
   TOP HUD
===================================================== */

#topHUD{
    position:absolute;
    z-index:50;

    left:0;
    right:0;
    top:0;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:
        linear-gradient(
            180deg,
            rgba(0,5,12,.92),
            rgba(0,5,12,.60),
            rgba(0,5,12,0)
        );

    border-bottom:1px solid rgba(0,190,255,.18);
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoMain{
    font-family:Impact,Arial Black,sans-serif;
    font-size:30px;
    font-style:italic;
    letter-spacing:-1px;

    text-shadow:
        0 2px 0 #111,
        0 0 12px rgba(255,255,255,.12);
}

.logoChaos{
    color:#ff1aa8;

    text-shadow:
        0 0 8px rgba(255,0,160,.65),
        0 0 18px rgba(255,0,160,.35);
}

.logoLine{
    width:1px;
    height:30px;
    background:rgba(255,255,255,.28);
}

.night{
    font-size:13px;
    font-weight:800;
    letter-spacing:2px;
    color:#ff1aa8;
}

/* SCORE */

.rightHUD{
    display:flex;
    align-items:center;
    gap:25px;
}

.score{
    display:flex;
    align-items:center;
    gap:13px;

    font-weight:900;
}

.scoreTitle{
    color:#00d8ff;
    font-size:20px;
    letter-spacing:1px;
}

.scoreNumber{
    font-size:18px;
}

.iconBtn{
    width:38px;
    height:38px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    font-size:22px;

    border-left:1px solid rgba(255,255,255,.15);
    padding-left:20px;
}

/* =====================================================
   ALEX
===================================================== */

#player{
    position:absolute;

    left:46%;
    top:48%;

    width:54px;
    height:88px;

    z-index:30;

    transform:translate(-50%,-50%);

    transition:
        left .025s linear,
        top .025s linear;
}

/* BLUE GLOW */

.playerGlow{
    position:absolute;

    width:62px;
    height:62px;

    left:50%;
    top:76px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,210,255,.45),
            rgba(0,210,255,.12) 45%,
            transparent 70%
        );

    filter:blur(2px);
}

/* RING */

.playerRing{
    position:absolute;

    width:46px;
    height:14px;

    left:50%;
    top:78px;

    transform:translateX(-50%);

    border:2px solid #00d9ff;
    border-radius:50%;

    box-shadow:
        0 0 8px #00d9ff,
        0 0 22px rgba(0,210,255,.8);
}

/* BODY */

.alexBody{
    position:absolute;

    left:50%;
    top:29px;

    width:27px;
    height:35px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #05070a,
            #252a31,
            #080a0d
        );

    border-radius:7px 7px 5px 5px;

    box-shadow:
        0 5px 10px rgba(0,0,0,.8);
}

/* WHITE SHIRT */

.alexShirt{
    position:absolute;

    left:50%;
    top:32px;

    width:10px;
    height:23px;

    transform:translateX(-50%);

    background:#f2f4f4;

    clip-path:
        polygon(
            25% 0,
            75% 0,
            100% 100%,
            0 100%
        );
}

/* HEAD */

.alexHead{
    position:absolute;

    left:50%;
    top:7px;

    width:21px;
    height:23px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            145deg,
            #d79a72,
            #8c503d
        );

    border-radius:48% 48% 45% 45%;

    z-index:5;
}

/* HAIR */

.alexHair{
    position:absolute;

    left:50%;
    top:3px;

    width:25px;
    height:13px;

    transform:translateX(-50%) rotate(-4deg);

    background:#0a0b0e;

    border-radius:
        60% 55% 25% 25%;

    z-index:8;
}

/* GLASSES */

.alexGlasses{
    position:absolute;

    left:50%;
    top:15px;

    width:25px;
    height:7px;

    transform:translateX(-50%);

    z-index:10;
}

.alexGlasses span{
    position:absolute;

    width:10px;
    height:6px;

    background:#050608;

    border:1px solid #89919b;

    border-radius:2px;
}

.alexGlasses span:first-child{
    left:0;
}

.alexGlasses span:last-child{
    right:0;
}

.alexGlasses i{
    position:absolute;

    left:10px;
    top:2px;

    width:5px;
    height:1px;

    background:#777;
}

/* LEGS */

.leg{
    position:absolute;

    top:59px;

    width:9px;
    height:20px;

    background:#15181d;

    border-radius:2px;

    z-index:2;
}

.legLeft{
    left:17px;
}

.legRight{
    left:28px;
}

/* SHOES */

.shoe{
    position:absolute;

    top:77px;

    width:13px;
    height:6px;

    background:#eee;

    border-radius:5px;

    z-index:3;
}

.shoeLeft{
    left:12px;
}

.shoeRight{
    left:28px;
}

/* WALK */

.walking .legLeft{
    animation:
        walkLeft .16s infinite alternate;
}

.walking .legRight{
    animation:
        walkRight .16s infinite alternate;
}

@keyframes walkLeft{
    from{
        transform:rotate(9deg);
    }

    to{
        transform:rotate(-12deg);
    }
}

@keyframes walkRight{
    from{
        transform:rotate(-9deg);
    }

    to{
        transform:rotate(12deg);
    }
}

/* =====================================================
   NAME
===================================================== */

.nameTag{
    position:absolute;

    left:50%;
    top:-17px;

    transform:translateX(-50%);

    white-space:nowrap;

    padding:4px 8px;

    border-radius:4px;

    background:rgba(0,8,15,.85);

    border:1px solid rgba(0,210,255,.45);

    font-size:8px;
    font-weight:900;
    letter-spacing:1px;

    color:#dffaff;
}

/* =====================================================
   OBJECTIVE PANEL
===================================================== */

#objective{
    position:absolute;

    z-index:60;

    left:20px;
    bottom:48px;

    width:480px;
    min-height:74px;

    display:flex;
    align-items:center;

    padding:10px 18px;

    background:
        linear-gradient(
            90deg,
            rgba(0,8,18,.94),
            rgba(0,10,20,.76),
            rgba(0,10,20,.2)
        );

    border-top:1px solid rgba(0,205,255,.35);
    border-right:1px solid rgba(0,205,255,.15);
}

.objectiveIcon{
    width:44px;
    height:44px;

    border:3px solid #ffd400;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#ffd400;

    font-size:25px;
    font-weight:900;

    margin-right:16px;

    box-shadow:
        0 0 12px rgba(255,210,0,.3);
}

.objectiveTitle{
    color:#ffd400;
    font-size:13px;
    font-weight:900;
    margin-bottom:6px;
}

.objectiveText{
    font-size:15px;
    font-weight:700;
}

/* =====================================================
   MOBILE JOYSTICK
===================================================== */

#joystick{
    position:absolute;

    z-index:80;

    left:32px;
    bottom:45px;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(10,35,55,.86),
            rgba(4,14,24,.78)
        );

    border:2px solid rgba(205,230,255,.5);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.55),
        0 8px 30px rgba(0,0,0,.45);
}

.jbtn{
    position:absolute;

    width:42px;
    height:42px;

    border:none;

    background:transparent;

    color:#b8d9ed;

    font-size:27px;
    font-weight:900;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.jbtn:active{
    color:#00d9ff;
    transform:scale(.9);
}

.jup{
    left:59px;
    top:7px;
}

.jdown{
    left:59px;
    bottom:7px;
}

.jleft{
    left:7px;
    top:59px;
}

.jright{
    right:7px;
    top:59px;
}

/* CENTER */

.jcenter{
    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    height:58px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #31e9ff,
            #008fca 70%
        );

    border:2px solid white;

    box-shadow:
        0 0 16px rgba(0,215,255,.75),
        inset 0 0 12px rgba(255,255,255,.25);
}

/* =====================================================
   ACTION
===================================================== */

#action{
    position:absolute;

    z-index:80;

    right:40px;
    bottom:48px;

    width:118px;
    height:118px;

    border-radius:50%;

    border:2px solid #ff0da7;

    background:
        radial-gradient(
            circle,
            rgba(255,0,160,.55),
            rgba(95,0,60,.75)
        );

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-weight:900;

    box-shadow:
        0 0 25px rgba(255,0,170,.5),
        inset 0 0 25px rgba(255,0,170,.25);

    cursor:pointer;
}

.actionHand{
    font-size:37px;
    line-height:38px;
}

.actionText{
    font-size:13px;
    margin-top:4px;
}

/* =====================================================
   CONTROLS HELP
===================================================== */

#help{
    position:absolute;

    z-index:70;

    right:25px;
    bottom:28px;

    width:390px;
    height:66px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    background:
        rgba(0,8,16,.82);

    border-top:1px solid rgba(0,190,255,.2);
}

.keys{
    display:grid;

    grid-template-columns:
        repeat(3,25px);

    grid-template-rows:
        repeat(2,25px);

    gap:3px;
}

.key{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #9bb1c0;
    border-radius:4px;

    font-size:10px;
    font-weight:900;
}

.keyW{
    grid-column:2;
}

.keyA{
    grid-column:1;
    grid-row:2;
}

.keyS{
    grid-column:2;
    grid-row:2;
}

.keyD{
    grid-column:3;
    grid-row:2;
}

.helpText{
    font-size:12px;
    color:#ddd;
}

.helpDivider{
    width:1px;
    height:35px;
    background:rgba(255,255,255,.25);
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:801px){

    #joystick{
        display:none;
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    #topHUD{
        height:58px;
        padding:0 12px;
    }

    .logoMain{
        font-size:19px;
    }

    .logoLine{
        height:22px;
    }

    .night{
        font-size:8px;
        letter-spacing:1px;
    }

    .scoreTitle{
        font-size:12px;
    }

    .scoreNumber{
        font-size:13px;
    }

    .rightHUD{
        gap:10px;
    }

    .iconBtn{
        font-size:17px;
        width:25px;
        padding-left:10px;
    }

    #objective{
        left:12px;
        bottom:14px;

        width:calc(100% - 24px);

        min-height:55px;

        padding:8px 10px;

        opacity:.92;
    }

    .objectiveIcon{
        width:35px;
        height:35px;
        min-width:35px;

        font-size:19px;

        margin-right:9px;
    }

    .objectiveTitle{
        font-size:9px;
        margin-bottom:3px;
    }

    .objectiveText{
        font-size:11px;
    }

    #joystick{
        left:18px;
        bottom:80px;

        width:135px;
        height:135px;
    }

    .jup{
        left:47px;
        top:4px;
    }

    .jdown{
        left:47px;
        bottom:4px;
    }

    .jleft{
        left:4px;
        top:47px;
    }

    .jright{
        right:4px;
        top:47px;
    }

    .jcenter{
        width:50px;
        height:50px;
    }

    #action{
        right:18px;
        bottom:80px;

        width:100px;
        height:100px;
    }

    .actionHand{
        font-size:30px;
    }

    .actionText{
        font-size:11px;
    }

    #help{
        display:none;
    }
}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

    #joystick{
        transform:scale(.86);
        transform-origin:bottom left;
    }

    #action{
        transform:scale(.86);
        transform-origin:bottom right;
    }

}
</style>
</head>


<body>

<div id="game">

    <!-- MAP -->
    <div id="map">

        <!-- ALEX -->

        <div id="player">

            <div class="nameTag">
                ALEX • LV 01
            </div>

            <div class="playerGlow"></div>

            <div class="playerRing"></div>

            <div class="alexHead"></div>

            <div class="alexHair"></div>

            <div class="alexGlasses">
                <span></span>
                <i></i>
                <span></span>
            </div>

            <div class="alexBody"></div>

            <div class="alexShirt"></div>

            <div class="leg legLeft"></div>
            <div class="leg legRight"></div>

            <div class="shoe shoeLeft"></div>
            <div class="shoe shoeRight"></div>

        </div>

    </div>


    <!-- VIGNETTE -->
    <div id="vignette"></div>


    <!-- TOP HUD -->

    <div id="topHUD">

        <div class="logo">

            <div class="logoMain">
                PARTY NIGHT
                <span class="logoChaos">
                    CHAOS
                </span>
            </div>

            <div class="logoLine"></div>

            <div class="night">
                PROTOTYPE • NIGHT 01
            </div>

        </div>


        <div class="rightHUD">

            <div class="score">

                <div class="scoreTitle">
                    SCORE
                </div>

                <div
                    class="scoreNumber"
                    id="score">
                    0
                </div>

            </div>

            <div class="iconBtn">
                ⚙
            </div>

            <div class="iconBtn">
                ⏸
            </div>

        </div>

    </div>


    <!-- OBJECTIVE -->

    <div id="objective">

        <div class="objectiveIcon">
            !
        </div>

        <div>

            <div class="objectiveTitle">
                CURRENT OBJECTIVE
            </div>

            <div class="objectiveText">
                Find the VIP guest in the party hall
            </div>

        </div>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <button
            class="jbtn jup"
            data-key="up">
            ▲
        </button>

        <button
            class="jbtn jleft"
            data-key="left">
            ◀
        </button>

        <div class="jcenter"></div>

        <button
            class="jbtn jright"
            data-key="right">
            ▶
        </button>

        <button
            class="jbtn jdown"
            data-key="down">
            ▼
        </button>

    </div>


    <!-- ACTION -->

    <button id="action">

        <div class="actionHand">
            🖐
        </div>

        <div class="actionText">
            ACTION
        </div>

    </button>


    <!-- DESKTOP HELP -->

    <div id="help">

        <div class="keys">

            <div class="key keyW">
                W
            </div>

            <div class="key keyA">
                A
            </div>

            <div class="key keyS">
                S
            </div>

            <div class="key keyD">
                D
            </div>

        </div>

        <div class="helpText">
            Move
        </div>

        <div class="helpDivider"></div>

        <div style="font-size:27px;">
            🖱
        </div>

        <div class="helpText">
            Interact
        </div>

        <div class="helpDivider"></div>

        <div style="font-size:23px;">
            📱
        </div>

        <div class="helpText">
            (Mobile)
        </div>

    </div>

</div>


<script>

/* =====================================================
   GAME STATE
===================================================== */

const player =
    document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const actionButton =
    document.getElementById("action");


const keys = {
    up:false,
    down:false,
    left:false,
    right:false
};


let x = 46;
let y = 48;

let speed = 0.42;

let score = 0;


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        const k =
            e.key.toLowerCase();

        if(
            k === "w" ||
            k === "arrowup"
        ){
            keys.up = true;
        }

        if(
            k === "s" ||
            k === "arrowdown"
        ){
            keys.down = true;
        }

        if(
            k === "a" ||
            k === "arrowleft"
        ){
            keys.left = true;
        }

        if(
            k === "d" ||
            k === "arrowright"
        ){
            keys.right = true;
        }

        if(k === "e"){
            interact();
        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        const k =
            e.key.toLowerCase();

        if(
            k === "w" ||
            k === "arrowup"
        ){
            keys.up = false;
        }

        if(
            k === "s" ||
            k === "arrowdown"
        ){
            keys.down = false;
        }

        if(
            k === "a" ||
            k === "arrowleft"
        ){
            keys.left = false;
        }

        if(
            k === "d" ||
            k === "arrowright"
        ){
            keys.right = false;
        }

    }
);


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

document
.querySelectorAll(".jbtn")
.forEach(function(button){

    const direction =
        button.dataset.key;


    function start(e){

        e.preventDefault();

        keys[direction] = true;
    }


    function stop(e){

        e.preventDefault();

        keys[direction] = false;
    }


    button.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        stop,
        {passive:false}
    );

    button.addEventListener(
        "touchcancel",
        stop,
        {passive:false}
    );


    button.addEventListener(
        "mousedown",
        start
    );

    button.addEventListener(
        "mouseup",
        stop
    );

    button.addEventListener(
        "mouseleave",
        stop
    );

});


/* =====================================================
   ACTION
===================================================== */

function interact(){

    score += 10;

    scoreElement.innerText =
        score;

    actionButton.style.transform =
        "scale(.90)";

    setTimeout(function(){

        actionButton.style.transform =
            "";

    },120);

}


actionButton.addEventListener(
    "click",
    interact
);


/* =====================================================
   UPDATE PLAYER
===================================================== */

function update(){

    let moving = false;


    if(keys.up){

        y -= speed;

        moving = true;
    }


    if(keys.down){

        y += speed;

        moving = true;
    }


    if(keys.left){

        x -= speed;

        moving = true;

        player.style.transform =
            "translate(-50%,-50%) scaleX(-1)";
    }


    if(keys.right){

        x += speed;

        moving = true;

        player.style.transform =
            "translate(-50%,-50%) scaleX(1)";
    }


    /* BOUNDARY */

    x =
        Math.max(
            3,
            Math.min(
                97,
                x
            )
        );


    y =
        Math.max(
            10,
            Math.min(
                91,
                y
            )
        );


    /* POSITION */

    player.style.left =
        x + "%";

    player.style.top =
        y + "%";


    /* WALKING */

    if(moving){

        player.classList.add(
            "walking"
        );

    }else{

        player.classList.remove(
            "walking"
        );

    }


    requestAnimationFrame(
        update
    );
}


update();

</script>

</body>
</html>
