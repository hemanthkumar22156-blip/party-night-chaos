<body>

<div id="game"></div>

<script>

const WORLD_W = 2400;
const WORLD_H = 1400;

let player;
let walls;
let npcs = [];

let objective;
let objectiveDone = false;

let score = 0;

let scoreText;
let missionText;

let joystickBase;
let joystickThumb;
let actionButton;

let joystickActive = false;
let joystickId = null;

let joyX = 0;
let joyY = 0;

let cursors;
let keys;

let sceneRef;

const config = {

    type: Phaser.AUTO,

    parent:"game",

    width:1280,
    height:720,

    backgroundColor:"#050608",

    physics:{
        default:"arcade",
        arcade:{
            gravity:{y:0},
            debug:false
        }
    },

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH,
        width:1280,
        height:720
    },

    scene:{
        create:create,
        update:update
    }
};

new Phaser.Game(config);


/* =========================================================
   CREATE
========================================================= */

function create(){

    const scene=this;

    sceneRef=scene;

    scene.physics.world.setBounds(
        0,0,WORLD_W,WORLD_H
    );

    scene.cameras.main.setBounds(
        0,0,WORLD_W,WORLD_H
    );

    scene.add.rectangle(
        WORLD_W/2,
        WORLD_H/2,
        WORLD_W,
        WORLD_H,
        0x080a0e
    );

    createFloor(scene);

    walls=scene.physics.add.staticGroup();

    createArchitecture(scene);
    createFurniture(scene);
    createPartyDetails(scene);

    /* PLAYER */

    player=createPlayer(
        scene,
        1180,
        760
    );

    scene.physics.add.collider(
        player,
        walls
    );

    /* =====================================================
       REALISTIC NPCS
    ===================================================== */

    createNPC(scene,700,300,0);
    createNPC(scene,900,350,1);
    createNPC(scene,1100,300,2);
    createNPC(scene,1450,320,3);

    createNPC(scene,500,750,4);
    createNPC(scene,750,820,5);
    createNPC(scene,1550,760,6);

    createNPC(scene,1750,980,7);
    createNPC(scene,1950,1050,8);
    createNPC(scene,2150,850,9);

    createNPC(scene,500,1100,10);
    createNPC(scene,850,1120,11);

    npcs.forEach(npc=>{
        scene.physics.add.collider(
            npc,
            walls
        );
    });

    /* OBJECTIVE */

    objective=scene.add.circle(
        760,
        250,
        18,
        0xffd000
    );

    objective.setStrokeStyle(
        4,
        0xffffff,
        0.9
    );

    scene.tweens.add({
        targets:objective,
        scale:1.5,
        alpha:.45,
        duration:650,
        yoyo:true,
        repeat:-1
    });

    /* CAMERA */

    scene.cameras.main.startFollow(
        player,
        true,
        .08,
        .08
    );

    cursors=
        scene.input.keyboard.createCursorKeys();

    keys=
        scene.input.keyboard.addKeys({
            W:Phaser.Input.Keyboard.KeyCodes.W,
            A:Phaser.Input.Keyboard.KeyCodes.A,
            S:Phaser.Input.Keyboard.KeyCodes.S,
            D:Phaser.Input.Keyboard.KeyCodes.D
        });

    createHUD(scene);
    createMobileControls(scene);
}


/* =========================================================
   UPDATE
========================================================= */

function update(time,delta){

    if(!player)return;

    let x=0;
    let y=0;

    if(
        cursors.left.isDown ||
        keys.A.isDown
    )x-=1;

    if(
        cursors.right.isDown ||
        keys.D.isDown
    )x+=1;

    if(
        cursors.up.isDown ||
        keys.W.isDown
    )y-=1;

    if(
        cursors.down.isDown ||
        keys.S.isDown
    )y+=1;

    if(joystickActive){
        x=joyX;
        y=joyY;
    }

    const movement=
        new Phaser.Math.Vector2(x,y);

    const speed=240;

    if(movement.length()>0){

        movement.normalize();

        player.body.setVelocity(
            movement.x*speed,
            movement.y*speed
        );

        player.walking=true;

        if(movement.x<-.1){
            player.scaleX=-1;
        }
        else if(movement.x>.1){
            player.scaleX=1;
        }

    }else{

        player.body.setVelocity(0,0);
        player.walking=false;
    }

    animateCharacter(
        player,
        time,
        true
    );

    const distance=
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );

    if(
        distance<55 &&
        !objectiveDone
    ){

        objectiveDone=true;
        score+=100;

        scoreText.setText(
            "SCORE  "+score
        );

        missionText.setText(
            "VIP FOUND  •  MISSION COMPLETE"
        );

        missionText.setColor("#00ff9d");

        objective.setFillStyle(
            0x00ff9d
        );
    }

    /* NPC AI */

    npcs.forEach(npc=>{

        npc.timer-=delta;

        if(npc.timer<=0){

            npc.timer=
                Phaser.Math.Between(
                    1200,
                    3500
                );

            npc.targetX=
                Phaser.Math.Between(
                    180,
                    WORLD_W-180
                );

            npc.targetY=
                Phaser.Math.Between(
                    180,
                    WORLD_H-180
                );
        }

        const distance=
            Phaser.Math.Distance.Between(
                npc.x,
                npc.y,
                npc.targetX,
                npc.targetY
            );

        if(distance<25){

            npc.body.setVelocity(0,0);
            npc.walking=false;

        }else{

            const angle=
                Phaser.Math.Angle.Between(
                    npc.x,
                    npc.y,
                    npc.targetX,
                    npc.targetY
                );

            npc.body.setVelocity(
                Math.cos(angle)*35,
                Math.sin(angle)*35
            );

            npc.walking=true;

            if(Math.cos(angle)<-.1)
                npc.scaleX=-1;

            else if(Math.cos(angle)>.1)
                npc.scaleX=1;
        }

        animateCharacter(
            npc,
            time,
            false
        );
    });
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(scene){

    scene.add.rectangle(
        1200,
        700,
        2250,
        1250,
        0x17191e
    );

    const graphics=
        scene.add.graphics();

    graphics.lineStyle(
        1,
        0x292d35,
        .45
    );

    for(let x=80;x<WORLD_W;x+=80){

        graphics.lineBetween(
            x,
            70,
            x,
            WORLD_H-70
        );
    }

    for(let y=70;y<WORLD_H;y+=80){

        graphics.lineBetween(
            70,
            y,
            WORLD_W-70,
            y
        );
    }

    scene.add.rectangle(
        1200,
        700,
        2250,
        1250
    ).setStrokeStyle(
        8,
        0x313846
    );
}

    addWall(scene,740,335,30,430);
    addWall(scene,1300,335,30,430);
    addWall(scene,1900,270,30,300);

    addWall(scene,740,760,30,300);

}


function createRoom(
    scene,
    x,y,w,h,color,label
){

    const room=
        scene.add.rectangle(
            x+w/2,
            y+h/2,
            w,h,
            color
        );

    room.setStrokeStyle(
        4,
        0x3b4353,
        .9
    );

    scene.add.text(
        x+25,
        y+22,
        label,
        {
            fontFamily:"Arial",
            fontSize:"22px",
            fontStyle:"bold",
            color:"#ffffff",
            backgroundColor:"#07090dcc",
            padding:{
                left:12,
                right:12,
                top:8,
                bottom:8
            }
        }
    );
}


function addWall(scene,x,y,w,h){

    const wall=
        scene.add.rectangle(
            x,y,w,h,
            0x090b10
        );

    wall.setStrokeStyle(
        2,
        0x47516a
    );

    scene.physics.add.existing(
        wall,
        true
    );

    walls.add(wall);
}

function createPartyDetails(scene){

    const lightPositions=[
        [180,170],[350,170],[520,170],
        [820,170],[1050,170],[1220,170],
        [1400,170],[1650,170],[1820,170],
        [180,700],[500,700],
        [800,650],[1100,650],[1400,650],[1700,650],
        [850,1010],[1150,1010],[1400,1010],
        [1650,1010],[2000,1010]
    ];

    lightPositions.forEach(
        ([x,y],index)=>{

            const glow=
                scene.add.circle(
                    x,y,18,
                    index%2
                    ?0xff238d
                    :0x00d9ff,
                    .12
                );

            scene.tweens.add({
                targets:glow,
                scale:1.6,
                alpha:.03,
                duration:800+index*40,
                yoyo:true,
                repeat:-1
            });

            scene.add.circle(
                x,y,5,
                index%2
                ?0xff238d
                :0x00d9ff
            );
        }
    );

    const plants=[
        [150,150],[690,150],
        [1340,150],[1870,150],
        [150,1030],[690,1030],
        [800,1240],[1510,1240]
    ];

    plants.forEach(
        ([x,y])=>createPlant(scene,x,y)
    );

    for(let i=0;i<80;i++){

        const x=
            Phaser.Math.Between(130,1880);

        const y=
            Phaser.Math.Between(140,550);

        scene.add.rectangle(
            x,y,3,7,
            [
                0xff238d,
                0x00d9ff,
                0xffd000,
                0xffffff
            ][i%4],
            .7
        );
    }
}


function createTable(scene,x,y){

    scene.add.circle(
        x,y,35,0x2b2520
    ).setStrokeStyle(
        3,0x715943
    );

    for(let i=0;i<4;i++){

        const a=(Math.PI*2/4)*i;

        scene.add.rectangle(
            x+Math.cos(a)*55,
            y+Math.sin(a)*55,
            25,25,
            0x302821
        );
    }
}

function createDJ(scene,x,y){

        x,y,180,70,0x08090d

            0,0,

        scene.add.ellipse(
            0,35,42,13,
            0x000000,.6
        );

    const glow=
        scene.add.circle(
            0,0,38,
            0xff238d,.025
        );

    /* LEGS */

    const leftLeg=
        scene.add.rectangle(
            -8,20,13,36,
            s.pants
        );

    const rightLeg=
        scene.add.rectangle(
            8,20,13,36,
            s.pants
        );

    /* SHOES */

    const leftShoe=
        scene.add.ellipse(
            -9,39,23,10,
            s.shoe
        );

    const rightShoe=
        scene.add.ellipse(
            9,39,23,10,
            s.shoe
        );

    /* BODY */

    const body=
        scene.add.rectangle(
            0,-10,39,51,
            s.shirt
        );

    body.setStrokeStyle(
        2,0x000000,.35
    );

    /* ARMS */

    const leftArm=
        scene.add.rectangle(
            -24,-7,10,39,
            s.shirt
        );

    const rightArm=
        scene.add.rectangle(
            24,-7,10,39,
            s.shirt
        );

    /* HANDS */

    scene.add.circle(
        -24,16,5,
        s.skin
    );

    scene.add.circle(
        24,16,5,
        s.skin
    );

    /* NECK */

    scene.add.rectangle(
        0,-40,11,10,
        s.skin
    );

    /* HEAD */

    const head=
        scene.add.ellipse(
            0,-55,34,39,
            s.skin
        );

    /* HAIR */

    const hair=
        scene.add.ellipse(
            0,-70,38,24,
            s.hair
        );

    /* HAIR FRONT */

    scene.add.rectangle(
        0,-63,31,9,
        s.hair
    );

    /* EYES */

    scene.add.rectangle(
        -7,-54,5,3,
        0x202020
    );

    scene.add.rectangle(
        7,-54,5,3,
        0x202020
    );

    c.add([

        glow,
        shadow,

        leftLeg,
        rightLeg,

        leftShoe,
        rightShoe,

        body,

        leftArm,
        rightArm,

        head,
        hair,

        scene.add.rectangle(
            0,-63,31,9,
            s.hair
        )

    ]);

    scene.physics.world.enable(c);

    c.body.setCircle(16);
    c.body.setCollideWorldBounds(true);

    c.targetX=x;
    c.targetY=y;

    c.timer=
        Phaser.Math.Between(
            500,
            2500
        );

    c.walking=false;
    c.walkCycle=0;

    c.leftArm=leftArm;
    c.rightArm=rightArm;
    c.leftLeg=leftLeg;
    c.rightLeg=rightLeg;
    c.glow=glow;

    npcs.push(c);
}


/* =========================================================
   CHARACTER ANIMATION
========================================================= */

function animateCharacter(
    character,
    time,
    isPlayer
){

    if(character.walking){

        character.walkCycle+=
            isPlayer ? .22 : .12;

        const swing=
            Math.sin(
                character.walkCycle
            );

        character.leftArm.rotation=
            swing*.22;

        character.rightArm.rotation=
            -swing*.22;

        character.leftLeg.rotation=
            -swing*.12;

        character.rightLeg.rotation=
            swing*.12;

    }else{

        character.leftArm.rotation=0;
        character.rightArm.rotation=0;

        character.leftLeg.rotation=0;
        character.rightLeg.rotation=0;
    }

    if(character.glow){

        character.glow.alpha=
            .025+
            Math.sin(time*.003)*.012;
    }
}

/* =========================================================
   MOBILE
========================================================= */

function createMobileControls(scene){

    joystickBase=
        scene.add.circle(
            105,605,65,
            0x111827,.75
        );

    joystickBase.setScrollFactor(0);

    joystickBase.setStrokeStyle(
        3,0x00d9ff,.7
    );

    joystickThumb=
        scene.add.circle(
            105,605,29,
            0x00d9ff,.8
        );

    joystickThumb.setScrollFactor(0);

    joystickBase.setInteractive();

    joystickBase.on(
        "pointerdown",
        pointer=>{

            joystickActive=true;
            joystickId=pointer.id;

            updateJoystick(pointer);
        }
    );

    scene.input.on(
        "pointermove",
        pointer=>{

            if(
                joystickActive &&
                pointer.id===joystickId
            ){
                updateJoystick(pointer);
            }
        }
    );

    scene.input.on(
        "pointerup",
        pointer=>{

            if(pointer.id===joystickId){

                joystickActive=false;
                joystickId=null;

                joyX=0;
                joyY=0;

                joystickThumb.x=
                    joystickBase.x;

                joystickThumb.y=
                    joystickBase.y;
            }
        }
    );

    actionButton=
        scene.add.circle(
            1175,605,58,
            0xff238d,.82
        );

    actionButton.setScrollFactor(0);

    actionButton.setStrokeStyle(
        3,0xffffff,.75
    );

    actionButton.setInteractive();

    actionButton.on(
        "pointerdown",
        actionPressed
    );

    scene.add.text(
        1175,605,
        "ACTION",
        {
            fontFamily:"Arial",
            fontSize:"13px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    )
    .setOrigin(.5)
    .setScrollFactor(0);

    if(
        !/Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
    ){

        joystickBase.setVisible(false);
        joystickThumb.setVisible(false);
        actionButton.setVisible(false);
    }
}


function updateJoystick(pointer){

    const dx=
        pointer.x-joystickBase.x;

    const dy=
        pointer.y-joystickBase.y;

    const distance=
        Math.sqrt(dx*dx+dy*dy);

    const max=45;

    let px=dx;
    let py=dy;

    if(distance>max){

        px=dx/distance*max;
        py=dy/distance*max;
    }

    joystickThumb.x=
        joystickBase.x+px;

    joystickThumb.y=
        joystickBase.y+py;

    joyX=px/max;
    joyY=py/max;
}


/* =========================================================
   ACTION
========================================================= */

function actionPressed(){

    if(!player||!objective)return;

    const distance=
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );

    if(
        distance<100 &&
        !objectiveDone
    ){

        objectiveDone=true;
        score+=100;

        scoreText.setText(
            "SCORE  "+score
        );

        missionText.setText(
            "MISSION COMPLETE  •  VIP FOUND"
        );

        missionText.setColor(
            "#00ff9d"
        );

        objective.setFillStyle(
            0x00ff9d
        );
    }
}
