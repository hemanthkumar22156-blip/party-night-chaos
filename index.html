<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Party Night: Chaos</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060a;
}

#game {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="game"></div>

<script>

const config = {
    type: Phaser.AUTO,

    width: 1280,
    height: 720,

    parent: "game",

    backgroundColor: "#05060a",

    physics: {
        default: "arcade",
        arcade: {
            gravity: {
                y: 0
            },
            debug: false
        }
    },

    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },

    scene: {
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

let player;
let walls;
let cursors;
let keys;

let npcs = [];

let objective;
let score = 0;

let scoreText;
let missionText;


/* =====================================================
   CREATE
===================================================== */

function create() {

    const scene = this;

    /* ===============================
       MAP BACKGROUND
    =============================== */

    scene.add.rectangle(
        640,
        360,
        1280,
        720,
        0x05060a
    );


    /* ===============================
       ROOMS
    =============================== */

    createRoom(
        scene,
        70,
        80,
        330,
        270,
        0x29113f,
        "PARTY HALL"
    );

    createRoom(
        scene,
        450,
        80,
        380,
        270,
        0x15313a,
        "KITCHEN"
    );

    createRoom(
        scene,
        880,
        80,
        330,
        270,
        0x291c35,
        "BEDROOM"
    );

    createRoom(
        scene,
        450,
        390,
        380,
        250,
        0x171e34,
        "LOUNGE"
    );

    createRoom(
        scene,
        880,
        390,
        330,
        250,
        0x102d22,
        "GARDEN"
    );


    /* ===============================
       WALLS
    =============================== */

    walls = scene.physics.add.staticGroup();

    addWall(scene, 640, 45, 1180, 25);
    addWall(scene, 640, 675, 1180, 25);

    addWall(scene, 45, 360, 25, 630);
    addWall(scene, 1235, 360, 25, 630);

    addWall(scene, 430, 210, 20, 260);
    addWall(scene, 430, 560, 20, 150);

    addWall(scene, 860, 210, 20, 260);
    addWall(scene, 860, 560, 20, 150);


    /* ===============================
       PLAYER
    =============================== */

    player = scene.add.circle(
        180,
        540,
        17,
        0x00d9ff
    );

    player.setStrokeStyle(
        4,
        0xffffff,
        0.9
    );

    scene.physics.add.existing(
        player
    );

    player.body.setCircle(
        17
    );

    player.body.setCollideWorldBounds(
        true
    );

    scene.physics.add.collider(
        player,
        walls
    );


    /* ===============================
       PLAYER GLOW
    =============================== */

    const playerGlow =
        scene.add.circle(
            180,
            540,
            38,
            0x00d9ff,
            0.10
        );

    scene.tweens.add({

        targets: playerGlow,

        scale: 1.4,

        alpha: 0.02,

        duration: 900,

        yoyo: true,

        repeat: -1

    });

    player.glow = playerGlow;


    /* ===============================
       NPCs
    =============================== */

    createNPC(scene, 180, 180, 0xff3d8d);

    createNPC(scene, 300, 250, 0xff3d8d);

    createNPC(scene, 550, 180, 0xffc107);

    createNPC(scene, 720, 250, 0xffc107);

    createNPC(scene, 980, 180, 0x8d5cff);

    createNPC(scene, 1080, 500, 0x00ff9d);


    /* ===============================
       OBJECTIVE
    =============================== */

    objective =
        scene.add.circle(
            1080,
            570,
            15,
            0xffd000
        );

    objective.setStrokeStyle(
        3,
        0xffffff
    );


    scene.tweens.add({

        targets: objective,

        scale: 1.4,

        alpha: 0.45,

        duration: 700,

        yoyo: true,

        repeat: -1

    });


    /* ===============================
       CONTROLS
    =============================== */

    cursors =
        scene.input.keyboard.createCursorKeys();

    keys =
        scene.input.keyboard.addKeys({
            W: Phaser.Input.Keyboard.KeyCodes.W,
            A: Phaser.Input.Keyboard.KeyCodes.A,
            S: Phaser.Input.Keyboard.KeyCodes.S,
            D: Phaser.Input.Keyboard.KeyCodes.D
        });


    /* ===============================
       UI
    =============================== */

    createUI(scene);

}


/* =====================================================
   UPDATE
===================================================== */

function update(time, delta) {

    if (!player) {
        return;
    }


    let x = 0;
    let y = 0;

    const speed = 220;


    if (
        cursors.left.isDown ||
        keys.A.isDown
    ) {
        x = -1;
    }

    if (
        cursors.right.isDown ||
        keys.D.isDown
    ) {
        x = 1;
    }

    if (
        cursors.up.isDown ||
        keys.W.isDown
    ) {
        y = -1;
    }

    if (
        cursors.down.isDown ||
        keys.S.isDown
    ) {
        y = 1;
    }


    const direction =
        new Phaser.Math.Vector2(
            x,
            y
        );


    if (direction.length() > 0) {

        direction.normalize();

        player.body.setVelocity(
            direction.x * speed,
            direction.y * speed
        );

    } else {

        player.body.setVelocity(
            0,
            0
        );

    }


    /* ===============================
       MOVE PLAYER GLOW
    =============================== */

    if (player.glow) {

        player.glow.x =
            player.x;

        player.glow.y =
            player.y;

    }


    /* ===============================
       OBJECTIVE CHECK
    =============================== */

    const distance =
        Phaser.Math.Distance.Between(
            player.x,
            player.y,
            objective.x,
            objective.y
        );


    if (distance < 45) {

        missionText.setText(
            "MISSION COMPLETE  +100"
        );

        missionText.setColor(
            "#00ff9d"
        );

        if (!objective.completed) {

            objective.completed = true;

            score += 100;

            scoreText.setText(
                "SCORE  " + score
            );

        }

    } else {

        missionText.setText(
            "Reach the yellow objective"
        );

        missionText.setColor(
            "#ffffff"
        );

    }


    /* ===============================
       NPC MOVEMENT
    =============================== */

    npcs.forEach(npc => {

        npc.timer -= delta;


        if (npc.timer <= 0) {

            npc.timer =
                Phaser.Math.Between(
                    1200,
                    3000
                );

            npc.targetX =
                Phaser.Math.Between(
                    100,
                    1150
                );

            npc.targetY =
                Phaser.Math.Between(
                    120,
                    600
                );

        }


        const angle =
            Phaser.Math.Angle.Between(
                npc.x,
                npc.y,
                npc.targetX,
                npc.targetY
            );


        npc.body.setVelocity(
            Math.cos(angle) * 35,
            Math.sin(angle) * 35
        );

    });

}


/* =====================================================
   ROOM
===================================================== */

function createRoom(
    scene,
    x,
    y,
    width,
    height,
    color,
    title
) {

    const room =
        scene.add.rectangle(
            x + width / 2,
            y + height / 2,
            width,
            height,
            color
        );

    room.setStrokeStyle(
        2,
        0x4f5a72,
        0.8
    );


    /* Room title */

    scene.add.text(
        x + 15,
        y + 15,
        title,
        {
            fontFamily: "Arial",
            fontSize: "16px",
            fontStyle: "bold",
            color: "#ffffff",
            backgroundColor: "#05060acc",
            padding: {
                left: 8,
                right: 8,
                top: 5,
                bottom: 5
            }
        }
    );


    /* Party floor */

    if (title === "PARTY HALL") {

        for (
            let px = x + 70;
            px < x + width - 40;
            px += 45
        ) {

            for (
                let py = y + 80;
                py < y + height - 30;
                py += 45
            ) {

                const tile =
                    scene.add.rectangle(
                        px,
                        py,
                        30,
                        30,
                        0xff238d,
                        0.15
                    );

                scene.tweens.add({

                    targets: tile,

                    alpha: 0.35,

                    duration:
                        Phaser.Math.Between(
                            700,
                            1500
                        ),

                    yoyo: true,

                    repeat: -1

                });

            }

        }

    }

}


/* =====================================================
   WALL
===================================================== */

function addWall(
    scene,
    x,
    y,
    width,
    height
) {

    const wall =
        scene.add.rectangle(
            x,
            y,
            width,
            height,
            0x070a12
        );


    wall.setStrokeStyle(
        2,
        0x35405a
    );


    scene.physics.add.existing(
        wall,
        true
    );


    walls.add(
        wall
    );

}


/* =====================================================
   NPC
===================================================== */

function createNPC(
    scene,
    x,
    y,
    color
) {

    const npc =
        scene.add.circle(
            x,
            y,
            13,
            color
        );


    npc.setStrokeStyle(
        2,
        0xffffff,
        0.7
    );


    scene.physics.add.existing(
        npc
    );


    npc.body.setCircle(
        13
    );


    npc.body.setCollideWorldBounds(
        true
    );


    scene.physics.add.collider(
        npc,
        walls
    );


    npc.targetX = x;
    npc.targetY = y;

    npc.timer = 0;


    npcs.push(npc);

}


/* =====================================================
   UI
===================================================== */

function createUI(scene) {

    /* Top bar */

    scene.add.rectangle(
        640,
        30,
        1280,
        60,
        0x05060a,
        0.94
    );


    scene.add.text(
        25,
        17,
        "PARTY NIGHT: CHAOS",
        {
            fontFamily: "Arial",
            fontSize: "23px",
            fontStyle: "bold",
            color: "#ffffff"
        }
    );


    scene.add.text(
        280,
        21,
        "PROTOTYPE • NIGHT 01",
        {
            fontFamily: "Arial",
            fontSize: "13px",
            color: "#ff238d"
        }
    );


    scoreText =
        scene.add.text(
            1080,
            18,
            "SCORE  0",
            {
                fontFamily: "Arial",
                fontSize: "20px",
                fontStyle: "bold",
                color: "#00d9ff"
            }
        );


    /* Bottom bar */

    scene.add.rectangle(
        640,
        685,
        1280,
        70,
        0x05060a,
        0.94
    );


    scene.add.text(
        25,
        660,
        "OBJECTIVE",
        {
            fontFamily: "Arial",
            fontSize: "13px",
            fontStyle: "bold",
            color: "#ffd000"
        }
    );


    missionText =
        scene.add.text(
            25,
            680,
            "Reach the yellow objective",
            {
                fontFamily: "Arial",
                fontSize: "16px",
                color: "#ffffff"
            }
        );


    scene.add.text(
        950,
        678,
        "WASD / ARROWS  •  MOVE",
        {
            fontFamily: "Arial",
            fontSize: "13px",
            color: "#9aa4b5"
        }
    );

}

</script>

</body>
</html>
